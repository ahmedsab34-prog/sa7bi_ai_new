name: Sa7bi AI - Unified Verified Release

run-name: Sa7bi AI Release - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Approve deployment of both Workers and publication of the verified APK to the stable download link."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sa7bi-unified-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: "fix/build-692-network-client-lifecycle"
  APP_VERSION: "1.0.1"
  EXPECTED_APPLICATION_ID: "com.example.sa7bi_ai_new"
  EXPECTED_RELEASE_CERT_SHA256: "8861f29093a09f80132873c09d3fd7f2252785ad7b8e6cf2241a60605cd254d9"
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"
  APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"
  RELEASE_TAG: "apk-latest"
  RELEASE_APK_NAME: "sa7bi-ai.apk"
  WORKER_URL: "https://sa7bi-ai-new.ahmedsab34.workers.dev"
  FALLBACK_WORKER_URL: "https://sa7bi-ai-new-fallback.ahmedsab34.workers.dev"

jobs:

  build-test-verify:
    name: Build and verify APK from the exact approved commit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      actions: read

    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}

    steps:

      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify repository, branch, and source commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REPOSITORY}" != "ahmedsab34-prog/sa7bi_ai_new" ]]; then
            echo "::error::Unexpected repository."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]]; then
            echo "::error::Release is restricted to ${EXPECTED_BRANCH}."
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [[ "${ACTUAL_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checked-out source does not match the selected commit."
            exit 1
          fi

          echo "Repository verified."
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Source SHA: ${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-save \
            --no-package-lock \
            --no-audit \
            --no-fund

      - name: Run backend provider and route tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Verify AdMob configuration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          node verify-admob-config.mjs

      - name: Validate primary Worker bundle
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy \
            --dry-run \
            --config wrangler.toml

      - name: Validate fallback Worker bundle
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy \
            --dry-run \
            --config wrangler-fallback.toml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ env.JAVA_VERSION }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: stable
          cache: true

      - name: Require successful candidate build for this exact commit
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CANDIDATE_INFO="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-candidate.yml/runs?branch=fix%2Fbuild-692-network-client-lifecycle&status=success&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.run_number)\t\(.head_sha)"'
          )"

          if [ -z "${CANDIDATE_INFO}" ]; then
            echo "::error::No successful candidate build was found."
            exit 1
          fi

          IFS=$'\t' read -r CANDIDATE_RUN_NUMBER CANDIDATE_SHA <<< "${CANDIDATE_INFO}"

          if ! [[ "${CANDIDATE_RUN_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Candidate run number is invalid."
            exit 1
          fi

          if [[ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::The latest successful candidate build belongs to a different commit."
            echo "Expected: ${GITHUB_SHA}"
            echo "Candidate: ${CANDIDATE_SHA}"
            exit 1
          fi

          BUILD_NUMBER="$((1000 + CANDIDATE_RUN_NUMBER + 1))"

          echo "Candidate run: ${CANDIDATE_RUN_NUMBER}"
          echo "Candidate commit: ${CANDIDATE_SHA}"
          echo "APK version code: ${BUILD_NUMBER}"

          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "${GITHUB_ENV}"

      - name: Create release artifact identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:12}"
          ARTIFACT_NAME="sa7bi-ai-unified-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

          {
            echo "Repository=${GITHUB_REPOSITORY}"
            echo "Branch=${GITHUB_REF_NAME}"
            echo "Commit=${GITHUB_SHA}"
            echo "RunID=${GITHUB_RUN_ID}"
            echo "RunAttempt=${GITHUB_RUN_ATTEMPT}"
            echo "AppVersion=${APP_VERSION}"
            echo "BuildNumber=${BUILD_NUMBER}"
            echo "ApplicationID=${EXPECTED_APPLICATION_ID}"
            echo "Artifact=${ARTIFACT_NAME}"
          } | tee build-provenance.txt

      - name: Verify committed dependency lockfile
        shell: bash
        run: |
          set -euo pipefail

          if ! git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo "::error::pubspec.lock must be committed before a release."
            exit 1
          fi

          test -s pubspec.lock

      - name: Configure permanent Android release signing
        shell: bash
        env:
          SA7BI_RELEASE_KEYSTORE_BASE64: ${{ secrets.SA7BI_RELEASE_KEYSTORE_BASE64 }}
          SA7BI_RELEASE_STORE_PASSWORD: ${{ secrets.SA7BI_RELEASE_STORE_PASSWORD }}
          SA7BI_RELEASE_KEY_ALIAS: ${{ secrets.SA7BI_RELEASE_KEY_ALIAS }}
          SA7BI_RELEASE_KEY_PASSWORD: ${{ secrets.SA7BI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SA7BI_RELEASE_KEYSTORE_BASE64}" ] ||
             [ -z "${SA7BI_RELEASE_STORE_PASSWORD}" ] ||
             [ -z "${SA7BI_RELEASE_KEY_ALIAS}" ] ||
             [ -z "${SA7BI_RELEASE_KEY_PASSWORD}" ]; then
            echo "::error::All four permanent Android signing secrets are required."
            exit 1
          fi

          mkdir -p android

          printf '%s' "${SA7BI_RELEASE_KEYSTORE_BASE64}" |
            base64 --decode > android/sa7bi-release.jks

          if [ ! -s android/sa7bi-release.jks ]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi

          chmod 600 android/sa7bi-release.jks

          keytool -list \
            -keystore android/sa7bi-release.jks \
            -storepass "${SA7BI_RELEASE_STORE_PASSWORD}" \
            -alias "${SA7BI_RELEASE_KEY_ALIAS}" \
            >/dev/null

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value):
              result = []
              for index, char in enumerate(value):
                  if char in "\\:=#!" or (index == 0 and char == " "):
                      result.append("\\")
                  result.append(char)
              return "".join(result)

          values = {
              "storeFile": "sa7bi-release.jks",
              "storePassword": os.environ["SA7BI_RELEASE_STORE_PASSWORD"],
              "keyAlias": os.environ["SA7BI_RELEASE_KEY_ALIAS"],
              "keyPassword": os.environ["SA7BI_RELEASE_KEY_PASSWORD"],
          }

          content = "".join(
              f"{key}={escape_property(value)}\n"
              for key, value in values.items()
          )

          path = Path("android/key.properties")
          path.write_text(content, encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Install locked Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Confirm dependency lockfile is unchanged
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error::pubspec.lock changed during dependency installation."
            exit 1
          fi

      - name: Analyze complete Flutter project
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-pub \
            --no-fatal-warnings \
            --no-fatal-infos \
            2>&1 | tee flutter-analyze-report.txt

      - name: Run all Flutter tests
        shell: bash
        run: |
          set -euo pipefail

          flutter test --no-pub --reporter expanded \
            2>&1 | tee flutter-test-report.txt

      - name: Build signed release APK from exact commit
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ID="release-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          SOURCE_ID="${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          flutter build apk --release --no-pub \
            --build-name="${APP_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define="SA7BI_APP_VERSION=${APP_VERSION}" \
            --dart-define="SA7BI_BUILD_NUMBER=${BUILD_NUMBER}" \
            --dart-define="SA7BI_COMMIT_SHA=${GITHUB_SHA}" \
            --dart-define="APP_BUILD_ID=${BUILD_ID}" \
            --dart-define="APP_SOURCE_ID=${SOURCE_ID}"

      - name: Verify APK package, signature, version, and integrity
        shell: bash
        run: |
          set -euo pipefail

          APK="${APK_PATH}"

          if [ ! -s "${APK}" ]; then
            echo "::error::APK is missing or empty."
            exit 1
          fi

          APK_ANALYZER="$(
            find "${ANDROID_HOME}" -type f \
              -name apkanalyzer -perm -u+x -print -quit 2>/dev/null
          )"

          APK_SIGNER="$(
            find "${ANDROID_HOME}/build-tools" -type f \
              -name apksigner -perm -u+x -print -quit 2>/dev/null
          )"

          if [ -z "${APK_ANALYZER}" ] || [ -z "${APK_SIGNER}" ]; then
            echo "::error::Android APK verification tools were not found."
            exit 1
          fi

          ACTUAL_ID="$("${APK_ANALYZER}" manifest application-id "${APK}")"
          ACTUAL_VERSION="$("${APK_ANALYZER}" manifest version-name "${APK}")"
          ACTUAL_CODE="$("${APK_ANALYZER}" manifest version-code "${APK}")"
          APK_BYTES="$(stat -c%s "${APK}")"
          APK_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"

          echo "Application ID: ${ACTUAL_ID}"
          echo "Version: ${ACTUAL_VERSION}"
          echo "Version code: ${ACTUAL_CODE}"
          echo "APK size: ${APK_BYTES}"
          echo "APK SHA-256: ${APK_SHA256}"

          test "${ACTUAL_ID}" = "${EXPECTED_APPLICATION_ID}"
          test "${ACTUAL_VERSION}" = "${APP_VERSION}"
          test "${ACTUAL_CODE}" = "${BUILD_NUMBER}"
          test "${APK_BYTES}" -gt 1000000

          unzip -tq "${APK}"

          unzip -l "${APK}" | grep -q 'libapp.so'

          "${APK_SIGNER}" verify --verbose "${APK}"

          SIGNATURE_REPORT="$(
            "${APK_SIGNER}" verify --print-certs "${APK}"
          )"

          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "${SIGNATURE_REPORT}" |
              awk 'tolower($0) ~ /certificate sha-256 digest:/ {
                sub(/^.*digest:[[:space:]]*/, "");
                print;
                exit
              }' |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"

          EXPECTED_CERT_SHA256="$(
            printf '%s' "${EXPECTED_RELEASE_CERT_SHA256}" |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [ -z "${ACTUAL_CERT_SHA256}" ] ||
             [ "${ACTUAL_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error::Release signing certificate mismatch."
            exit 1
          fi

          mkdir -p release-artifact

          cp "${APK}" "release-artifact/${RELEASE_APK_NAME}"

          printf '%s  %s\n' \
            "${APK_SHA256}" \
            "${RELEASE_APK_NAME}" \
            > "release-artifact/${RELEASE_APK_NAME}.sha256"

          {
            echo "Repository=${GITHUB_REPOSITORY}"
            echo "Branch=${GITHUB_REF_NAME}"
            echo "Commit=${GITHUB_SHA}"
            echo "RunID=${GITHUB_RUN_ID}"
            echo "RunAttempt=${GITHUB_RUN_ATTEMPT}"
            echo "AppVersion=${ACTUAL_VERSION}"
            echo "ApplicationID=${ACTUAL_ID}"
            echo "VersionCode=${ACTUAL_CODE}"
            echo "APKSize=${APK_BYTES}"
            echo "APK_SHA256=${APK_SHA256}"
            echo "SigningCertificateSHA256=${ACTUAL_CERT_SHA256}"
            echo "CanonicalFilename=${RELEASE_APK_NAME}"
            echo "CanonicalReleaseTag=${RELEASE_TAG}"
            echo "WorkerDeployment=required-before-publication"
          } > release-artifact/build-provenance.txt

          cp flutter-analyze-report.txt release-artifact/
          cp flutter-test-report.txt release-artifact/

      - name: Reject APK if branch advanced during build
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = "fix/build-692-network-client-lifecycle";

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branchName,
            });

            core.info(`APK commit: ${context.sha}`);
            core.info(`Current branch commit: ${branch.commit.sha}`);

            if (branch.commit.sha !== context.sha) {
              core.setFailed(
                "The feature branch advanced during the build. " +
                "This APK cannot be published as the latest version."
              );
            }

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Build verification summary
        shell: bash
        run: |
          {
            echo "## APK build and verification passed"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Version code: ${BUILD_NUMBER}"
            echo "- APK: ${RELEASE_APK_NAME}"
            echo "- Worker deployment: pending separate gated job"
            echo "- Stable release publication: not performed in this job"
          } >> "${GITHUB_STEP_SUMMARY}"


  deploy-workers:
    name: Deploy and verify both Workers from the same commit
    needs: build-test-verify
    if: ${{ inputs.publish_release == true && needs.build-test-verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:

      - name: Checkout exact APK source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify branch, commit, and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]]; then
            echo "::error::Worker deployment is restricted to the working branch."
            exit 1
          fi

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          if [ -z "${CLOUDFLARE_API_TOKEN}" ] ||
             [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Cloudflare credentials are missing."
            exit 1
          fi

          echo "Worker source commit: ${GITHUB_SHA}"
          echo "Cloudflare credential presence verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-save \
            --no-package-lock \
            --no-audit \
            --no-fund

      - name: Run backend tests and AdMob checks
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npm run check
          node verify-admob-config.mjs

      - name: Verify approved Worker targets
        shell: bash
        run: |
          set -euo pipefail

          grep -Fx 'name = "sa7bi-ai-new"' backend/wrangler.toml
          grep -Fx 'main = "src/index-v2.js"' backend/wrangler.toml

          grep -Fx 'name = "sa7bi-ai-new-fallback"' backend/wrangler-fallback.toml
          grep -Fx 'main = "src/fallback.js"' backend/wrangler-fallback.toml
          grep -Fx 'service = "sa7bi-ai-new"' backend/wrangler-fallback.toml

      - name: Dry-run primary Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy \
            --dry-run \
            --config wrangler.toml \
            --var "SA7BI_SOURCE_COMMIT:${GITHUB_SHA}"

      - name: Dry-run fallback Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy \
            --dry-run \
            --config wrangler-fallback.toml \
            --var "SA7BI_SOURCE_COMMIT:${GITHUB_SHA}"

      - name: Confirm branch has not advanced before deployment
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = "fix/build-692-network-client-lifecycle";

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branchName,
            });

            if (branch.commit.sha !== context.sha) {
              core.setFailed(
                "The branch advanced before Worker deployment. " +
                "No release will be published from an outdated commit."
              );
            }

      - name: Deploy primary Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy \
            --config wrangler.toml \
            --var "SA7BI_SOURCE_COMMIT:${GITHUB_SHA}"

      - name: Deploy fallback Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy \
            --config wrangler-fallback.toml \
            --var "SA7BI_SOURCE_COMMIT:${GITHUB_SHA}"

      - name: Verify live Worker health and exact source identity
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          PRIMARY_URL: ${{ env.WORKER_URL }}
          FALLBACK_URL: ${{ env.FALLBACK_WORKER_URL }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          expected = os.environ["EXPECTED_SOURCE_COMMIT"].strip()

          def fetch(url):
              request = urllib.request.Request(
                  url.rstrip("/") + "/health",
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "Sa7bi-AI-Unified-Release/1.0",
                  },
              )

              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"Health check failed: HTTP {response.status}"
                      )

                  body = json.loads(
                      response.read().decode("utf-8")
                  )

                  return body, response.headers

          primary_data, _ = fetch(os.environ["PRIMARY_URL"])
          primary_commit = str(
              primary_data.get("sourceCommit", "")
          ).strip()

          print("Primary expected:", expected)
          print("Primary actual:  ", primary_commit)

          if primary_commit.lower() != expected.lower():
              raise RuntimeError(
                  "Primary Worker source commit does not match the APK."
              )

          fallback_data, fallback_headers = fetch(
              os.environ["FALLBACK_URL"]
          )

          fallback_route = str(
              fallback_headers.get(
                  "X-Sa7bi-Network-Fallback", ""
              )
          ).strip()

          fallback_commit = str(
              fallback_headers.get(
                  "X-Sa7bi-Fallback-Source-Commit", ""
              )
          ).strip()

          forwarded_primary_commit = str(
              fallback_data.get("sourceCommit", "")
          ).strip()

          print("Fallback expected:", expected)
          print("Fallback actual:  ", fallback_commit)
          print("Fallback route:   ", fallback_route)

          if fallback_route != "1":
              raise RuntimeError(
                  "Fallback response did not confirm fallback routing."
              )

          if fallback_commit.lower() != expected.lower():
              raise RuntimeError(
                  "Fallback Worker source commit does not match the APK."
              )

          if forwarded_primary_commit.lower() != expected.lower():
              raise RuntimeError(
                  "Fallback is forwarding a different Primary source commit."
              )

          print("PASS: Primary and Fallback match the APK source commit.")
          PY

      - name: Worker deployment summary
        shell: bash
        run: |
          {
            echo "## Both Workers deployed and verified"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Primary: ${WORKER_URL}"
            echo "- Fallback: ${FALLBACK_WORKER_URL}"
            echo "- Primary source identity: verified"
            echo "- Fallback source identity: verified"
            echo "- APK source commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"


  publish-canonical-release:
    name: Publish the single stable APK link
    needs:
      - build-test-verify
      - deploy-workers

    if: ${{ inputs.publish_release == true && needs.build-test-verify.result == 'success' && needs.deploy-workers.result == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:

      - name: Download APK from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test-verify.outputs.artifact_name }}
          path: release-artifact

      - name: Verify APK artifact and provenance
        shell: bash
        run: |
          set -euo pipefail

          cd release-artifact

          test -s "${RELEASE_APK_NAME}"
          test -s "${RELEASE_APK_NAME}.sha256"
          test -s "build-provenance.txt"

          grep -Fx "Commit=${GITHUB_SHA}" build-provenance.txt

          sha256sum --check "${RELEASE_APK_NAME}.sha256"
          unzip -tq "${RELEASE_APK_NAME}"

      - name: Confirm branch still points to the APK and Worker commit
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = "fix/build-692-network-client-lifecycle";

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branchName,
            });

            core.info(`Release commit: ${context.sha}`);
            core.info(`Current branch: ${branch.commit.sha}`);

            if (branch.commit.sha !== context.sha) {
              core.setFailed(
                "The branch advanced before publication. " +
                "The stable APK link will not be updated."
              );
            }

      - name: Prepare stable release notes
        shell: bash
        run: |
          set -euo pipefail

          cd release-artifact

          APK_SHA256="$(awk '{print $1}' "${RELEASE_APK_NAME}.sha256")"

          {
            echo "# Sa7bi AI - Latest Verified APK"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- App version: ${APP_VERSION}"
            echo "- APK: ${RELEASE_APK_NAME}"
            echo "- APK SHA-256: ${APK_SHA256}"
            echo "- Worker deployment: primary and fallback deployed"
            echo "- Worker source identity: verified against this commit"
            echo
            echo "## Permanent download link"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_NAME}"
          } > release-notes.md

      - name: Publish APK to the stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd release-artifact

          if ! gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then

            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sa7bi AI - Latest Verified APK" \
              --notes-file release-notes.md
          fi

          gh release upload "${RELEASE_TAG}" \
            "${RELEASE_APK_NAME}" \
            "${RELEASE_APK_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Sa7bi AI - Latest Verified APK" \
            --notes-file release-notes.md

      - name: Verify published asset and SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd release-artifact

          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,assets,body \
            > release-state.json

          test "$(
            jq -r '.tagName' release-state.json
          )" = "${RELEASE_TAG}"

          PUBLISHED_COUNT="$(
            jq --arg name "${RELEASE_APK_NAME}" \
              '[.assets[] | select(.name == $name)] | length' \
              release-state.json
          )"

          test "${PUBLISHED_COUNT}" -eq 1

          EXPECTED_SIZE="$(stat -c%s "${RELEASE_APK_NAME}")"

          PUBLISHED_SIZE="$(
            jq --arg name "${RELEASE_APK_NAME}" \
              -r '.assets[] | select(.name == $name) | .size' \
              release-state.json
          )"

          test "${PUBLISHED_SIZE}" = "${EXPECTED_SIZE}"

          EXPECTED_SHA="$(
            awk '{print $1}' "${RELEASE_APK_NAME}.sha256"
          )"

          PUBLISHED_SHA="$(
            jq --arg name "${RELEASE_APK_NAME}" \
              -r '.assets[] | select(.name == $name) | .digest // ""' \
              release-state.json |
              sed 's/^sha256://'
          )"

          test -n "${PUBLISHED_SHA}"
          test "${PUBLISHED_SHA}" = "${EXPECTED_SHA}"

          jq -r '.body' release-state.json |
            grep -F "${GITHUB_SHA}"

          {
            echo "## Unified release successfully published"
            echo
            echo "- APK source commit: ${GITHUB_SHA}"
            echo "- Primary Worker source commit: ${GITHUB_SHA}"
            echo "- Fallback Worker source commit: ${GITHUB_SHA}"
            echo "- APK size: ${PUBLISHED_SIZE} bytes"
            echo "- APK SHA-256: ${PUBLISHED_SHA}"
            echo
            echo "### One permanent download link"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"


  publication-not-requested:
    name: Verified artifact only - no deployment or publication
    needs:
      - build-test-verify

    if: ${{ inputs.publish_release != true && needs.build-test-verify.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Record safe artifact-only result
        shell: bash
        run: |
          {
            echo "## APK artifact verified - not published"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- APK artifact: available in this workflow run"
            echo "- Worker deployment: NO"
            echo "- Stable GitHub Release: unchanged"
            echo "- Public distribution link: unchanged"
          } >> "${GITHUB_STEP_SUMMARY}"


  release-blocked:
    name: Release blocked because a required stage failed
    needs:
      - build-test-verify
      - deploy-workers

    if: ${{ always() && inputs.publish_release == true && (needs.build-test-verify.result != 'success' || needs.deploy-workers.result != 'success') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Record that no partial release was published
        shell: bash
        run: |
          {
            echo "## Unified release blocked"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- APK build result: ${{ needs.build-test-verify.result }}"
            echo "- Worker deployment result: ${{ needs.deploy-workers.result }}"
            echo "- Stable APK link was not updated."
            echo "- A failed stage must be repaired before another release attempt."
          } >> "${GITHUB_STEP_SUMMARY}"
