
      - name: Verify live Worker health and exact source identity
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.refresh-dependencies.outputs.source_sha }}
          PRIMARY_URL: ${{ env.WORKER_URL }}
          FALLBACK_URL: ${{ env.FALLBACK_WORKER_URL }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = os.environ["EXPECTED_SOURCE_COMMIT"].strip()
          primary_url = os.environ["PRIMARY_URL"]
          fallback_url = os.environ["FALLBACK_URL"]

          def fetch(url):
              request = urllib.request.Request(
                  url.rstrip("/") + "/health",
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      "User-Agent": "Sa7bi-AI-Unified-Release/1.1",
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"Health check failed: HTTP {response.status}"
                      )
                  body = json.loads(response.read().decode("utf-8"))
                  return body, response.headers

          # Verify Primary first. A mismatch here must stop the release.
          primary_data, _ = fetch(primary_url)
          primary_commit = str(
              primary_data.get("sourceCommit", "")
          ).strip()

          print("Primary expected:", expected)
          print("Primary actual:  ", primary_commit)

          if primary_commit.lower() != expected.lower():
              raise RuntimeError(
                  "Primary Worker source commit does not match the APK."
              )

          # Cloudflare propagation can take time. Retry Fallback identity
          # checks for up to 90 seconds, but never publish on a mismatch.
          max_attempts = 19
          delay_seconds = 5
          verified = False
          last_error = "No successful fallback identity response."

          for attempt in range(1, max_attempts + 1):
              try:
                  fallback_data, fallback_headers = fetch(fallback_url)

                  fallback_route = str(
                      fallback_headers.get(
                          "X-Sa7bi-Network-Fallback", ""
                      )
                  ).strip()

                  fallback_commit = str(
                      fallback_headers.get(
                          "X-Sa7bi-Fallback-Source-Commit", ""
                      )
                  ).strip()

                  forwarded_primary_commit = str(
                      fallback_data.get("sourceCommit", "")
                  ).strip()

                  print(f"Fallback attempt: {attempt}/{max_attempts}")
                  print("Fallback expected:", expected)
                  print("Fallback actual:  ", fallback_commit)
                  print("Fallback route:   ", fallback_route)
                  print("Forwarded primary:", forwarded_primary_commit)

                  if fallback_route != "1":
                      raise RuntimeError(
                          "Fallback response did not confirm fallback routing."
                      )

                  if fallback_commit.lower() != expected.lower():
                      raise RuntimeError(
                          "Fallback Worker source commit is not updated yet."
                      )

                  if forwarded_primary_commit.lower() != expected.lower():
                      raise RuntimeError(
                          "Fallback is forwarding a different Primary source commit."
                      )

                  verified = True
                  print(
                      "PASS: APK, Primary, and Fallback use the same source commit."
                  )
                  break

              except Exception as error:
                  last_error = str(error)

                  if attempt < max_attempts:
                      remaining = (max_attempts - attempt) * delay_seconds
                      print(
                          f"Fallback identity not ready: {last_error}. "
                          f"Retrying in {delay_seconds}s; "
                          f"up to {remaining}s remain.",
                          flush=True,
                      )
                      time.sleep(delay_seconds)

          if not verified:
              raise RuntimeError(
                  f"Fallback Worker identity did not match {expected} "
                  f"after {max_attempts} attempts. Last issue: {last_error}"
              )
          PY
