
name: Sa7bi AI - Single Source Verified Release

run-name: Sa7bi AI Release - ${{ github.sha }}

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle

  workflow_dispatch:
    inputs:
      publish_release:
        description: "Set true only when you explicitly approve deploying both Workers and publishing the APK."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sa7bi-single-source-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: "fix/build-692-network-client-lifecycle"
  APP_VERSION: "1.0.1"
  EXPECTED_APPLICATION_ID: "com.example.sa7bi_ai_new"
  EXPECTED_RELEASE_CERT_SHA256: "8861f29093a09f80132873c09d3fd7f2252785ad7b8e6cf2241a60605cd254d9"
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"
  APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"
  RELEASE_TAG: "apk-latest"
  RELEASE_APK_NAME: "sa7bi-ai.apk"
  WORKER_URL: "https://sa7bi-ai-new.ahmedsab34.workers.dev"
  FALLBACK_WORKER_URL: "https://sa7bi-ai-new-fallback.ahmedsab34.workers.dev"

jobs:
  verify-source:
    name: Verify immutable source commit and committed lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository, branch, commit, and lockfile
        id: source
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          git ls-files --error-unmatch pubspec.lock >/dev/null
          test -s pubspec.lock

          echo "source_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Immutable source verified"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Exact source commit: ${GITHUB_SHA}"
            echo "- pubspec.lock: committed and unchanged"
            echo "- Automatic lockfile commits: disabled"
          } >> "${GITHUB_STEP_SUMMARY}"

  build-test-verify:
    name: Test and build the signed APK from the exact source commit
    needs: verify-source
    if: ${{ needs.verify-source.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}

    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}

    steps:
      - name: Checkout the exact verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checked out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test -s pubspec.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-save --no-package-lock --no-audit --no-fund
          fi

      - name: Run backend provider and route tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Verify AdMob configuration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          node verify-admob-config.mjs

      - name: Validate Primary Worker without deployment
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.toml

      - name: Validate Fallback Worker without deployment
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler-fallback.toml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Resolve only the committed Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Calculate APK version code
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid workflow run number."
            exit 1
          fi

          BUILD_NUMBER="$((200000 + GITHUB_RUN_NUMBER))"

          if [ "${BUILD_NUMBER}" -gt 2100000000 ]; then
            echo "::error::Android version code exceeded the supported range."
            exit 1
          fi

          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "${GITHUB_ENV}"

      - name: Create artifact identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${SOURCE_SHA:0:12}"
          ARTIFACT_NAME="sa7bi-ai-release-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

          {
            echo "Repository=${GITHUB_REPOSITORY}"
            echo "Branch=${EXPECTED_BRANCH}"
            echo "Commit=${SOURCE_SHA}"
            echo "RunID=${GITHUB_RUN_ID}"
            echo "RunNumber=${GITHUB_RUN_NUMBER}"
            echo "AppVersion=${APP_VERSION}"
            echo "BuildNumber=${BUILD_NUMBER}"
            echo "ApplicationID=${EXPECTED_APPLICATION_ID}"
            echo "Artifact=${ARTIFACT_NAME}"
          } > build-provenance.txt

      - name: Configure permanent Android release signing
        shell: bash
        env:
          SA7BI_RELEASE_KEYSTORE_BASE64: ${{ secrets.SA7BI_RELEASE_KEYSTORE_BASE64 }}
          SA7BI_RELEASE_STORE_PASSWORD: ${{ secrets.SA7BI_RELEASE_STORE_PASSWORD }}
          SA7BI_RELEASE_KEY_ALIAS: ${{ secrets.SA7BI_RELEASE_KEY_ALIAS }}
          SA7BI_RELEASE_KEY_PASSWORD: ${{ secrets.SA7BI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${SA7BI_RELEASE_KEYSTORE_BASE64}"
          test -n "${SA7BI_RELEASE_STORE_PASSWORD}"
          test -n "${SA7BI_RELEASE_KEY_ALIAS}"
          test -n "${SA7BI_RELEASE_KEY_PASSWORD}"

          mkdir -p android

          printf '%s' "${SA7BI_RELEASE_KEYSTORE_BASE64}" \
            | base64 --decode > android/sa7bi-release.jks

          test -s android/sa7bi-release.jks
          chmod 600 android/sa7bi-release.jks

          keytool -list \
            -keystore android/sa7bi-release.jks \
            -storepass "${SA7BI_RELEASE_STORE_PASSWORD}" \
            -alias "${SA7BI_RELEASE_KEY_ALIAS}" >/dev/null

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value):
              result = []
              for index, char in enumerate(value):
                  if char in "\\:=#!" or (index == 0 and char == " "):
                      result.append("\\")
                  result.append(char)
              return "".join(result)

          values = {
              "storeFile": "sa7bi-release.jks",
              "storePassword": os.environ["SA7BI_RELEASE_STORE_PASSWORD"],
              "keyAlias": os.environ["SA7BI_RELEASE_KEY_ALIAS"],
              "keyPassword": os.environ["SA7BI_RELEASE_KEY_PASSWORD"],
          }

          content = "".join(
              f"{key}={escape_property(value)}\n"
              for key, value in values.items()
          )

          path = Path("android/key.properties")
          path.write_text(content, encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Analyze the Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos \
            2>&1 | tee flutter-analyze-report.txt

      - name: Run Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            2>&1 | tee flutter-test-report.txt

      - name: Regenerate Android release configuration
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --config-only

          REGISTRANT="android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"

          test -s "${REGISTRANT}"

          if grep -Fq 'dev.flutter.plugins.integration_test.IntegrationTestPlugin' "${REGISTRANT}"; then
            echo "::error::Release registrant contains the dev-only integration_test plugin."
            exit 1
          fi

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ID="release-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          SOURCE_ID="${GITHUB_REPOSITORY}@${SOURCE_SHA}"

          flutter build apk --release --no-pub \
            --build-name="${APP_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define="SA7BI_APP_VERSION=${APP_VERSION}" \
            --dart-define="SA7BI_BUILD_NUMBER=${BUILD_NUMBER}" \
            --dart-define="SA7BI_COMMIT_SHA=${SOURCE_SHA}" \
            --dart-define="APP_BUILD_ID=${BUILD_ID}" \
            --dart-define="APP_SOURCE_ID=${SOURCE_ID}"

      - name: Verify APK identity, signature, and checksum
        shell: bash
        run: |
          set -euo pipefail

          APK="${APK_PATH}"
          test -s "${APK}"

          APK_ANALYZER="$(find "${ANDROID_HOME}" -type f -name apkanalyzer -perm -u+x -print -quit)"
          APK_SIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x -print -quit)"

          test -n "${APK_ANALYZER}"
          test -n "${APK_SIGNER}"

          ACTUAL_ID="$("${APK_ANALYZER}" manifest application-id "${APK}")"
          ACTUAL_VERSION="$("${APK_ANALYZER}" manifest version-name "${APK}")"
          ACTUAL_CODE="$("${APK_ANALYZER}" manifest version-code "${APK}")"
          APK_BYTES="$(stat -c%s "${APK}")"
          APK_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"

          test "${ACTUAL_ID}" = "${EXPECTED_APPLICATION_ID}"
          test "${ACTUAL_VERSION}" = "${APP_VERSION}"
          test "${ACTUAL_CODE}" = "${BUILD_NUMBER}"
          test "${APK_BYTES}" -gt 1000000

          unzip -tq "${APK}"
          unzip -l "${APK}" | grep -q 'libapp.so'

          "${APK_SIGNER}" verify --verbose "${APK}"

          SIGNATURE_REPORT="$("${APK_SIGNER}" verify --print-certs "${APK}")"

          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "${SIGNATURE_REPORT}" |
            awk 'tolower($0) ~ /certificate sha-256 digest:/ {
              sub(/^.*digest:[[:space:]]*/, "")
              print
              exit
            }' |
            tr -d ':[:space:]' |
            tr '[:upper:]' '[:lower:]'
          )"

          EXPECTED_CERT_SHA256="$(
            printf '%s' "${EXPECTED_RELEASE_CERT_SHA256}" |
            tr -d ':[:space:]' |
            tr '[:upper:]' '[:lower:]'
          )"

          test -n "${ACTUAL_CERT_SHA256}"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_CERT_SHA256}"

          mkdir -p release-artifact

          cp "${APK}" "release-artifact/${RELEASE_APK_NAME}"

          printf '%s  %s\n' "${APK_SHA256}" "${RELEASE_APK_NAME}" \
            > "release-artifact/${RELEASE_APK_NAME}.sha256"

          {
            echo "Repository=${GITHUB_REPOSITORY}"
            echo "Branch=${EXPECTED_BRANCH}"
            echo "Commit=${SOURCE_SHA}"
            echo "RunID=${GITHUB_RUN_ID}"
            echo "RunNumber=${GITHUB_RUN_NUMBER}"
            echo "AppVersion=${ACTUAL_VERSION}"
            echo "ApplicationID=${ACTUAL_ID}"
            echo "VersionCode=${ACTUAL_CODE}"
            echo "APKSize=${APK_BYTES}"
            echo "APK_SHA256=${APK_SHA256}"
            echo "SigningCertificateSHA256=${ACTUAL_CERT_SHA256}"
          } > release-artifact/build-provenance.txt

          cp flutter-analyze-report.txt release-artifact/
          cp flutter-test-report.txt release-artifact/

      - name: Reject APK if source branch advanced
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        with:
          script: |
            const branchName = "fix/build-692-network-client-lifecycle";
            const expectedSha = process.env.SOURCE_SHA;

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branchName,
            });

            if (branch.commit.sha !== expectedSha) {
              core.setFailed("The branch advanced during the build. This APK cannot be released.");
            }

      - name: Upload the verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Build verification summary
        shell: bash
        run: |
          {
            echo "## APK built and verified"
            echo
            echo "- Exact source commit: ${SOURCE_SHA}"
            echo "- APK version code: ${BUILD_NUMBER}"
            echo "- Artifact: ${{ steps.identity.outputs.artifact_name }}"
            echo "- No second APK build is used for publication."
            echo "- No Worker deployment was performed by this job."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-workers:
    name: Deploy and verify both Workers from the APK source commit
    needs:
      - verify-source
      - build-test-verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && needs.verify-source.result == 'success' && needs.build-test-verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact APK source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify source and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

          REMOTE_SHA="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk 'NR == 1 { print $1 }')"
          test "${REMOTE_SHA}" = "${SOURCE_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-save --no-package-lock --no-audit --no-fund
          fi

      - name: Re-run backend checks before deployment
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node verify-admob-config.mjs

      - name: Verify configured Worker targets
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'name = "sa7bi-ai-new"' backend/wrangler.toml
          grep -Fx 'main = "src/index-v2.js"' backend/wrangler.toml
          grep -Fx 'name = "sa7bi-ai-new-fallback"' backend/wrangler-fallback.toml
          grep -Fx 'main = "src/fallback.js"' backend/wrangler-fallback.toml
          grep -Fx 'service = "sa7bi-ai-new"' backend/wrangler-fallback.toml

      - name: Dry-run Primary Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.toml \
            --var "SA7BI_SOURCE_COMMIT:${SOURCE_SHA}"

      - name: Dry-run Fallback Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler-fallback.toml \
            --var "SA7BI_SOURCE_COMMIT:${SOURCE_SHA}"

      - name: Confirm source branch has not advanced
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        with:
          script: |
            const branchName = "fix/build-692-network-client-lifecycle";
            const expectedSha = process.env.SOURCE_SHA;

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branchName,
            });

            if (branch.commit.sha !== expectedSha) {
              core.setFailed("Source branch advanced. Deployment stopped.");
            }

      - name: Deploy Primary Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml \
            --var "SA7BI_SOURCE_COMMIT:${SOURCE_SHA}"

      - name: Deploy Fallback Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler-fallback.toml \
            --var "SA7BI_SOURCE_COMMIT:${SOURCE_SHA}"

      - name: Verify live source identity of both Workers
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.verify-source.outputs.source_sha }}
          PRIMARY_URL: ${{ env.WORKER_URL }}
          FALLBACK_URL: ${{ env.FALLBACK_WORKER_URL }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = os.environ["EXPECTED_SOURCE_COMMIT"].strip()
          primary_url = os.environ["PRIMARY_URL"]
          fallback_url = os.environ["FALLBACK_URL"]

          def fetch(url):
              request = urllib.request.Request(
                  url.rstrip("/") + "/health",
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      "User-Agent": "Sa7bi-AI-Unified-Release",
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  body = json.loads(response.read().decode("utf-8"))
                  return body, response.headers

          primary_data, _ = fetch(primary_url)
          primary_commit = str(primary_data.get("sourceCommit", "")).strip()

          print("Expected commit:", expected)
          print("Primary commit:", primary_commit)

          if primary_commit.lower() != expected.lower():
              raise RuntimeError("Primary Worker source identity mismatch.")

          verified = False
          last_error = "Fallback identity not verified."

          for attempt in range(1, 20):
              try:
                  fallback_data, headers = fetch(fallback_url)

                  fallback_route = str(
                      headers.get("X-Sa7bi-Network-Fallback", "")
                  ).strip()

                  fallback_commit = str(
                      headers.get("X-Sa7bi-Fallback-Source-Commit", "")
                  ).strip()

                  forwarded_commit = str(
                      fallback_data.get("sourceCommit", "")
                  ).strip()

                  print("Fallback attempt:", attempt)
                  print("Fallback route:", fallback_route)
                  print("Fallback commit:", fallback_commit)
                  print("Forwarded commit:", forwarded_commit)

                  if fallback_route != "1":
                      raise RuntimeError("Fallback route header is missing.")

                  if fallback_commit.lower() != expected.lower():
                      raise RuntimeError("Fallback source identity mismatch.")

                  if forwarded_commit.lower() != expected.lower():
                      raise RuntimeError("Fallback forwards a different Primary identity.")

                  verified = True
                  break

              except Exception as error:
                  last_error = str(error)
                  print("Fallback verification pending:", last_error)
                  if attempt < 19:
                      time.sleep(5)

          if not verified:
              raise RuntimeError(
                  f"Fallback verification failed: {last_error}"
              )

          print("PASS: Primary and Fallback match the APK source commit.")
          PY

      - name: Worker deployment summary
        shell: bash
        run: |
          {
            echo "## Both Workers verified"
            echo
            echo "- Exact source commit: ${SOURCE_SHA}"
            echo "- Primary: ${WORKER_URL}"
            echo "- Fallback: ${FALLBACK_WORKER_URL}"
            echo "- Both live identities matched the APK source."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-canonical-release:
    name: Publish the exact verified APK to apk-latest
    needs:
      - verify-source
      - build-test-verify
      - deploy-workers
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && needs.verify-source.result == 'success' && needs.build-test-verify.result == 'success' && needs.deploy-workers.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Download the APK from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test-verify.outputs.artifact_name }}
          path: release-artifact

      - name: Verify APK artifact and provenance
        shell: bash
        run: |
          set -euo pipefail

          cd release-artifact

          test -s "${RELEASE_APK_NAME}"
          test -s "${RELEASE_APK_NAME}.sha256"
          test -s build-provenance.txt

          grep -Fx "Commit=${SOURCE_SHA}" build-provenance.txt
          sha256sum --check "${RELEASE_APK_NAME}.sha256"
          unzip -tq "${RELEASE_APK_NAME}"

      - name: Confirm branch still points to the exact source
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        with:
          script: |
            const branchName = "fix/build-692-network-client-lifecycle";
            const expectedSha = process.env.SOURCE_SHA;

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branchName,
            });

            if (branch.commit.sha !== expectedSha) {
              core.setFailed("Branch advanced. Stable APK publication stopped.");
            }

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          cd release-artifact
          APK_SHA256="$(awk '{print $1}' "${RELEASE_APK_NAME}.sha256")"

          {
            echo "# Sa7bi AI - Latest Verified APK"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${EXPECTED_BRANCH}"
            echo "- Exact source commit: ${SOURCE_SHA}"
            echo "- App version: ${APP_VERSION}"
            echo "- APK: ${RELEASE_APK_NAME}"
            echo "- APK SHA-256: ${APK_SHA256}"
            echo "- Primary and Fallback Workers verified against this commit"
            echo
            echo "## Permanent download link"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_NAME}"
          } > release-notes.md

      - name: Publish or update the stable APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd release-artifact

          if ! gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then

            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" \
              --title "Sa7bi AI - Latest Verified APK" \
              --notes-file release-notes.md
          fi

          gh release upload "${RELEASE_TAG}" \
            "${RELEASE_APK_NAME}" \
            "${RELEASE_APK_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Sa7bi AI - Latest Verified APK" \
            --notes-file release-notes.md

      - name: Verify published APK checksum and stable tag target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p published-check
          cd published-check

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${RELEASE_APK_NAME}" \
            --pattern "${RELEASE_APK_NAME}.sha256"

          test -s "${RELEASE_APK_NAME}"
          test -s "${RELEASE_APK_NAME}.sha256"
          sha256sum --check "${RELEASE_APK_NAME}.sha256"

          EXPECTED_SHA="$(awk '{print $1}' "${RELEASE_APK_NAME}.sha256")"
          ORIGINAL_SHA="$(awk '{print $1}' "../release-artifact/${RELEASE_APK_NAME}.sha256")"

          test "${EXPECTED_SHA}" = "${ORIGINAL_SHA}"

          git fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          TAG_TARGET_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"

          echo "Expected source: ${SOURCE_SHA}"
          echo "Actual tag target: ${TAG_TARGET_SHA}"

          if [ "${TAG_TARGET_SHA}" != "${SOURCE_SHA}" ]; then
            echo "::error::Stable release tag does not point to the APK source commit."
            exit 1
          fi

          {
            echo "## Unified release published and verified"
            echo
            echo "- APK source commit: ${SOURCE_SHA}"
            echo "- Primary Worker source commit: ${SOURCE_SHA}"
            echo "- Fallback Worker source commit: ${SOURCE_SHA}"
            echo "- Stable tag target: ${TAG_TARGET_SHA}"
            echo "- APK SHA-256: ${EXPECTED_SHA}"
            echo
            echo "### Permanent APK link"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"

  manual-build-only:
    name: Build-only result - no deployment or publication
    needs:
      - verify-source
      - build-test-verify
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release != true)) && needs.verify-source.result == 'success' && needs.build-test-verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Record safe build-only result
        shell: bash
        run: |
          {
            echo "## Build-only verification completed"
            echo
            echo "- Source commit: ${{ needs.verify-source.outputs.source_sha }}"
            echo "- APK artifact: uploaded to this workflow run"
            echo "- Worker deployment: NO"
            echo "- Stable APK release: unchanged"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-blocked:
    name: Release blocked because a required stage failed
    needs:
      - verify-source
      - build-test-verify
      - deploy-workers
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_release == true &&
          (needs.verify-source.result != 'success' ||
           needs.build-test-verify.result != 'success' ||
           needs.deploy-workers.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Record blocked release
        shell: bash
        run: |
          {
            echo "## Unified release blocked"
            echo
            echo "- Trigger commit: ${GITHUB_SHA}"
            echo "- Source verification: ${{ needs.verify-source.result }}"
            echo "- APK build: ${{ needs.build-test-verify.result }}"
            echo "- Worker deployment: ${{ needs.deploy-workers.result }}"
            echo "- Stable APK publication was not authorized by this job."
            echo "- If one Worker deployed and the other failed, do not publish the APK."
            echo "- Re-run the approved deployment from the same exact source commit after reviewing the failure."
          } >> "${GITHUB_STEP_SUMMARY}"
