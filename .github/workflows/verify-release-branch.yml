
name: Sa7bi AI - Canonical APK Release

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - ".github/workflows/verify-release-branch.yml"
      - "lib/**"
      - "test/**"
      - "android/**"
      - "assets/**"
      - "backend/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sa7bi-canonical-apk-release
  cancel-in-progress: false

env:
  APP_VERSION: "1.0.1"
  EXPECTED_APPLICATION_ID: "com.example.sa7bi_ai_new"
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"
  APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"
  RELEASE_TAG: "apk-latest"
  RELEASE_APK_NAME: "sa7bi-ai.apk"

jobs:
  build-test-verify-publish:
    name: Test, build, verify, and publish the canonical APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "App version: ${APP_VERSION}"
            echo "Expected package ID: ${EXPECTED_APPLICATION_ID}"
            echo "Expected version code: $((1000 + GITHUB_RUN_NUMBER))"
            echo
            flutter --version
            dart --version
            java -version
          } 2>&1 | tee build-provenance.txt

      - name: Install locked project dependencies
        run: flutter pub get

      - name: Analyze the Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            --no-fatal-warnings \
            --no-fatal-infos \
            2>&1 | tee flutter-analyze-report.txt

      - name: Run all Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            2>&1 | tee flutter-test-report.txt

      - name: Build release APK from this exact commit
        shell: bash
        run: |
          set -euo pipefail

          BUILD_NUMBER="$((1000 + GITHUB_RUN_NUMBER))"
          BUILD_ID="run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          SOURCE_ID="${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          flutter build apk --release \
            --build-name="${APP_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define="SA7BI_APP_VERSION=${APP_VERSION}" \
            --dart-define="SA7BI_BUILD_NUMBER=${BUILD_NUMBER}" \
            --dart-define="SA7BI_COMMIT_SHA=${GITHUB_SHA}" \
            --dart-define="APP_BUILD_ID=${BUILD_ID}" \
            --dart-define="APP_SOURCE_ID=${SOURCE_ID}"

      - name: Verify package identity, APK integrity, and checksum
        shell: bash
        run: |
          set -euo pipefail

          APK="${APK_PATH}"
          EXPECTED_BUILD_NUMBER="$((1000 + GITHUB_RUN_NUMBER))"

          test -s "${APK}" || {
            echo "ERROR: APK is missing or empty."
            exit 1
          }

          APK_ANALYZER="$(
            find "${ANDROID_HOME}" -type f \
              -name apkanalyzer -perm -u+x 2>/dev/null |
              head -n 1
          )"

          if [ -z "${APK_ANALYZER}" ]; then
            echo "ERROR: Android apkanalyzer was not found."
            exit 1
          fi

          ACTUAL_ID="$("${APK_ANALYZER}" manifest application-id "${APK}")"
          ACTUAL_VERSION="$("${APK_ANALYZER}" manifest version-name "${APK}")"
          ACTUAL_CODE="$("${APK_ANALYZER}" manifest version-code "${APK}")"
          APK_BYTES="$(stat -c%s "${APK}")"
          APK_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"

          echo "Application ID: ${ACTUAL_ID}"
          echo "Version name: ${ACTUAL_VERSION}"
          echo "Version code: ${ACTUAL_CODE}"
          echo "APK bytes: ${APK_BYTES}"
          echo "APK SHA-256: ${APK_SHA256}"

          test "${ACTUAL_ID}" = "${EXPECTED_APPLICATION_ID}" || {
            echo "ERROR: Unexpected application ID."
            exit 1
          }

          test "${ACTUAL_VERSION}" = "${APP_VERSION}" || {
            echo "ERROR: Unexpected version name."
            exit 1
          }

          test "${ACTUAL_CODE}" = "${EXPECTED_BUILD_NUMBER}" || {
            echo "ERROR: Unexpected version code."
            exit 1
          }

          if [ "${APK_BYTES}" -le 1000000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          unzip -t "${APK}"

          unzip -l "${APK}" | grep -q 'libapp.so' || {
            echo "ERROR: Compiled Flutter library is missing."
            exit 1
          }

          cp "${APK}" "${RELEASE_APK_NAME}"
          sha256sum "${RELEASE_APK_NAME}" > app-release.apk.sha256

          {
            echo "Repository=${GITHUB_REPOSITORY}"
            echo "Branch=${GITHUB_REF_NAME}"
            echo "Commit=${GITHUB_SHA}"
            echo "RunID=${GITHUB_RUN_ID}"
            echo "RunAttempt=${GITHUB_RUN_ATTEMPT}"
            echo "BuildID=run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            echo "SourceID=${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            echo "AppVersion=${ACTUAL_VERSION}"
            echo "ApplicationID=${ACTUAL_ID}"
            echo "VersionCode=${ACTUAL_CODE}"
            echo "APKSize=${APK_BYTES}"
            echo "APK_SHA256=${APK_SHA256}"
            echo "CanonicalFilename=${RELEASE_APK_NAME}"
            echo "CanonicalReleaseTag=${RELEASE_TAG}"
          } | tee -a build-provenance.txt

          echo "APK_SIZE=${APK_BYTES}" >> "${GITHUB_ENV}"
          echo "APK_SHA256=${APK_SHA256}" >> "${GITHUB_ENV}"

      - name: Upload the exact verified APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-ai-canonical-${{ github.run_number }}-${{ github.sha }}
          path: |
            sa7bi-ai.apk
            app-release.apk.sha256
            build-provenance.txt
            flutter-analyze-report.txt
            flutter-test-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the canonical APK to the stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null

          # Remove only the previous canonical APK and its checksum report.
          # Other release assets are not deleted.
          gh release delete-asset "${RELEASE_TAG}" "${RELEASE_APK_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --yes || true

          gh release delete-asset "${RELEASE_TAG}" "sa7bi-ai.apk.sha256" \
            --repo "${GITHUB_REPOSITORY}" --yes || true

          cp "${APK_PATH}" "${RELEASE_APK_NAME}"
          printf '%s  %s\n' "${APK_SHA256}" "${RELEASE_APK_NAME}" \
            > "sa7bi-ai.apk.sha256"

          test "$(stat -c%s "${RELEASE_APK_NAME}")" = "${APK_SIZE}"
          test "$(sha256sum "${RELEASE_APK_NAME}" | awk '{print $1}')" \
            = "${APK_SHA256}"

          gh release upload "${RELEASE_TAG}" \
            "${RELEASE_APK_NAME}" \
            "sa7bi-ai.apk.sha256" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify the published release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,assets
          )"

          echo "${RELEASE_JSON}" | jq .

          test "$(
            echo "${RELEASE_JSON}" | jq -r '.tagName'
          )" = "${RELEASE_TAG}"

          PUBLISHED_COUNT="$(
            echo "${RELEASE_JSON}" |
              jq '[.assets[] | select(.name == "sa7bi-ai.apk")] | length'
          )"

          test "${PUBLISHED_COUNT}" -eq 1 || {
            echo "ERROR: Expected exactly one canonical APK asset."
            exit 1
          }

          PUBLISHED_SIZE="$(
            echo "${RELEASE_JSON}" |
              jq -r '.assets[] |
                select(.name == "sa7bi-ai.apk") | .size'
          )"

          PUBLISHED_SHA="$(
            echo "${RELEASE_JSON}" |
              jq -r '.assets[] |
                select(.name == "sa7bi-ai.apk") | .digest' |
              sed 's/^sha256://'
          )"

          test "${PUBLISHED_SIZE}" = "${APK_SIZE}" || {
            echo "ERROR: Published APK size differs from the built APK."
            exit 1
          }

          test "${PUBLISHED_SHA}" = "${APK_SHA256}" || {
            echo "ERROR: Published APK checksum differs from the built APK."
            exit 1
          }

          {
            echo "## Canonical APK verified"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- App version: \`${APP_VERSION}\`"
            echo "- APK size: \`${APK_SIZE}\` bytes"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo "- Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
