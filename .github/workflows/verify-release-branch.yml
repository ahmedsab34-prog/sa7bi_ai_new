name: Sa7bi AI - Manually Approved Canonical APK Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Set true only after explicitly approving publication of this APK to the stable GitHub Release."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sa7bi-canonical-apk-release
  cancel-in-progress: false

env:
  APP_VERSION: "1.0.1"
  EXPECTED_APPLICATION_ID: "com.example.sa7bi_ai_new"
  EXPECTED_RELEASE_CERT_SHA256: "8861f29093a09f80132873c09d3fd7f2252785ad7b8e6cf2241a60605cd254d9"
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"
  APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"
  RELEASE_TAG: "apk-latest"
  RELEASE_APK_NAME: "sa7bi-ai.apk"

jobs:
  build-test-verify:
    name: Analyze, test, and build the exact selected source commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}

    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restrict release builds to the working branch
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_BRANCH="fix/build-692-network-client-lifecycle"

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]; then
            echo "::error::This workflow may only run from ${EXPECTED_BRANCH}. It must not build from main."
            exit 1
          fi

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ env.JAVA_VERSION }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: stable
          cache: true

      - name: Determine version code after latest successful candidate
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CANDIDATE_RUN_NUMBER="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-candidate.yml/runs?branch=fix%2Fbuild-692-network-client-lifecycle&status=success&per_page=1" \
              --jq '.workflow_runs[0].run_number // empty'
          )"

          if ! [[ "${CANDIDATE_RUN_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not find a successful Candidate Build on the working branch."
            exit 1
          fi

          # Candidate builds use 1000 + their run number.
          # The official APK receives the next higher version code.
          BUILD_NUMBER="$((1000 + CANDIDATE_RUN_NUMBER + 1))"

          echo "Latest successful candidate run: ${CANDIDATE_RUN_NUMBER}"
          echo "Official APK version code: ${BUILD_NUMBER}"

          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "${GITHUB_ENV}"
          echo "build_number=${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Create artifact identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_NAME="sa7bi-ai-verified-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"

          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "App version: ${APP_VERSION}"
            echo "Application ID: ${EXPECTED_APPLICATION_ID}"
            echo "Version code: ${BUILD_NUMBER}"
            echo "Artifact: ${ARTIFACT_NAME}"
          } | tee build-provenance.txt

      - name: Verify dependency lockfile is committed
        shell: bash
        run: |
          set -euo pipefail

          if ! git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo "::error::pubspec.lock must be committed before an official APK release."
            exit 1
          fi

          test -s pubspec.lock
          echo "Committed pubspec.lock found."

      - name: Configure permanent Android release signing
        shell: bash
        env:
          SA7BI_RELEASE_KEYSTORE_BASE64: ${{ secrets.SA7BI_RELEASE_KEYSTORE_BASE64 }}
          SA7BI_RELEASE_STORE_PASSWORD: ${{ secrets.SA7BI_RELEASE_STORE_PASSWORD }}
          SA7BI_RELEASE_KEY_ALIAS: ${{ secrets.SA7BI_RELEASE_KEY_ALIAS }}
          SA7BI_RELEASE_KEY_PASSWORD: ${{ secrets.SA7BI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SA7BI_RELEASE_KEYSTORE_BASE64}" ] ||
             [ -z "${SA7BI_RELEASE_STORE_PASSWORD}" ] ||
             [ -z "${SA7BI_RELEASE_KEY_ALIAS}" ] ||
             [ -z "${SA7BI_RELEASE_KEY_PASSWORD}" ]; then
            echo "::error::Permanent Android signing is required. All four SA7BI_RELEASE_* secrets must be present."
            exit 1
          fi

          mkdir -p android

          if ! printf '%s' "${SA7BI_RELEASE_KEYSTORE_BASE64}" |
            base64 --decode > android/sa7bi-release.jks; then
            echo "::error::The release keystore secret is not valid Base64."
            exit 1
          fi

          if [ ! -s android/sa7bi-release.jks ]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi

          chmod 600 android/sa7bi-release.jks

          if ! keytool -list \
            -keystore android/sa7bi-release.jks \
            -storepass "${SA7BI_RELEASE_STORE_PASSWORD}" \
            -alias "${SA7BI_RELEASE_KEY_ALIAS}" \
            >/dev/null; then
            echo "::error::The release keystore, password, or alias could not be validated."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value: str) -> str:
              escaped = []
              for index, char in enumerate(value):
                  if char in "\\:=#!" or (index == 0 and char == " "):
                      escaped.append("\\")
                  escaped.append(char)
              return "".join(escaped)

          values = {
              "storeFile": "sa7bi-release.jks",
              "storePassword": os.environ["SA7BI_RELEASE_STORE_PASSWORD"],
              "keyAlias": os.environ["SA7BI_RELEASE_KEY_ALIAS"],
              "keyPassword": os.environ["SA7BI_RELEASE_KEY_PASSWORD"],
          }

          content = "".join(
              f"{key}={escape_property(value)}\n"
              for key, value in values.items()
          )

          path = Path("android/key.properties")
          path.write_text(content, encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Install locked project dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Confirm dependency lockfile did not change
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error::flutter pub get changed pubspec.lock. Review and commit the intended lockfile before release."
            exit 1
          fi

          echo "Dependency lockfile is unchanged."

      - name: Analyze the Flutter project
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-pub \
            --no-fatal-warnings \
            --no-fatal-infos \
            2>&1 | tee flutter-analyze-report.txt

      - name: Run all Flutter tests
        shell: bash
        run: |
          set -euo pipefail

          flutter test --no-pub --reporter expanded \
            2>&1 | tee flutter-test-report.txt

      - name: Build release APK from this exact commit
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ID="release-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          SOURCE_ID="${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          flutter build apk --release --no-pub \
            --build-name="${APP_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define="SA7BI_APP_VERSION=${APP_VERSION}" \
            --dart-define="SA7BI_BUILD_NUMBER=${BUILD_NUMBER}" \
            --dart-define="SA7BI_COMMIT_SHA=${GITHUB_SHA}" \
            --dart-define="APP_BUILD_ID=${BUILD_ID}" \
            --dart-define="APP_SOURCE_ID=${SOURCE_ID}"

      - name: Verify package, version, integrity, signature, and certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="${APK_PATH}"

          if [ ! -s "${APK}" ]; then
            echo "::error::APK is missing or empty."
            exit 1
          fi

          APK_ANALYZER="$(
            find "${ANDROID_HOME}" -type f \
              -name apkanalyzer -perm -u+x -print -quit 2>/dev/null
          )"

          APK_SIGNER="$(
            find "${ANDROID_HOME}/build-tools" -type f \
              -name apksigner -perm -u+x -print -quit 2>/dev/null
          )"

          if [ -z "${APK_ANALYZER}" ] || [ -z "${APK_SIGNER}" ]; then
            echo "::error::apkanalyzer or apksigner was not found in the Android SDK."
            exit 1
          fi

          ACTUAL_ID="$("${APK_ANALYZER}" manifest application-id "${APK}")"
          ACTUAL_VERSION="$("${APK_ANALYZER}" manifest version-name "${APK}")"
          ACTUAL_CODE="$("${APK_ANALYZER}" manifest version-code "${APK}")"
          APK_BYTES="$(stat -c%s "${APK}")"
          APK_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"

          echo "Application ID: ${ACTUAL_ID}"
          echo "Version name: ${ACTUAL_VERSION}"
          echo "Version code: ${ACTUAL_CODE}"
          echo "APK bytes: ${APK_BYTES}"
          echo "APK SHA-256: ${APK_SHA256}"

          test "${ACTUAL_ID}" = "${EXPECTED_APPLICATION_ID}"
          test "${ACTUAL_VERSION}" = "${APP_VERSION}"
          test "${ACTUAL_CODE}" = "${BUILD_NUMBER}"
          test "${APK_BYTES}" -gt 1000000

          unzip -t "${APK}" >/dev/null
          unzip -l "${APK}" | grep -q 'libapp.so'

          if ! "${APK_SIGNER}" verify --verbose "${APK}"; then
            echo "::error::APK signature verification failed."
            exit 1
          fi

          SIGNATURE_REPORT="$(
            "${APK_SIGNER}" verify --print-certs "${APK}"
          )"

          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "${SIGNATURE_REPORT}" |
              awk 'tolower($0) ~ /certificate sha-256 digest:/ {
                sub(/^.*digest:[[:space:]]*/, "");
                print;
                exit
              }' |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"

          EXPECTED_CERT_SHA256="$(
            printf '%s' "${EXPECTED_RELEASE_CERT_SHA256}" |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [ -z "${ACTUAL_CERT_SHA256}" ]; then
            echo "::error::Could not read the APK signing certificate fingerprint."
            exit 1
          fi

          if [ "${ACTUAL_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error::APK release certificate does not match the permanent certificate."
            exit 1
          fi

          echo "Permanent release certificate fingerprint: MATCHED"

          mkdir -p release-artifact

          cp "${APK}" "release-artifact/${RELEASE_APK_NAME}"

          printf '%s  %s\n' \
            "${APK_SHA256}" \
            "${RELEASE_APK_NAME}" \
            > "release-artifact/${RELEASE_APK_NAME}.sha256"

          {
            echo "Repository=${GITHUB_REPOSITORY}"
            echo "Branch=${GITHUB_REF_NAME}"
            echo "Commit=${GITHUB_SHA}"
            echo "RunID=${GITHUB_RUN_ID}"
            echo "RunAttempt=${GITHUB_RUN_ATTEMPT}"
            echo "AppVersion=${ACTUAL_VERSION}"
            echo "ApplicationID=${ACTUAL_ID}"
            echo "VersionCode=${ACTUAL_CODE}"
            echo "APKSize=${APK_BYTES}"
            echo "APK_SHA256=${APK_SHA256}"
            echo "SigningCertificateSHA256=${ACTUAL_CERT_SHA256}"
            echo "CanonicalFilename=${RELEASE_APK_NAME}"
            echo "CanonicalReleaseTag=${RELEASE_TAG}"
            echo "WorkerDeployment=not-performed"
            echo "GitHubReleasePublication=not-performed-at-build-stage"
          } | tee -a build-provenance.txt

          cp build-provenance.txt release-artifact/build-provenance.txt
          cp flutter-analyze-report.txt release-artifact/flutter-analyze-report.txt
          cp flutter-test-report.txt release-artifact/flutter-test-report.txt

          echo "APK_SIZE=${APK_BYTES}" >> "${GITHUB_ENV}"
          echo "APK_SHA256=${APK_SHA256}" >> "${GITHUB_ENV}"

      - name: Upload the exact verified APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Build summary - artifact only
        if: ${{ inputs.publish_release != true }}
        shell: bash
        run: |
          {
            echo "## Verified APK artifact created - not published"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Version code: ${BUILD_NUMBER}"
            echo "- APK SHA-256: ${APK_SHA256}"
            echo "- GitHub Release publication: NO"
            echo "- Worker deployment: NO"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-canonical-release:
    name: Publish canonical APK only after explicit opt-in
    needs: build-test-verify
    if: ${{ inputs.publish_release == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download the verified APK artifact from this exact run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test-verify.outputs.artifact_name }}
          path: release-artifact

      - name: Verify downloaded artifact before publication
        shell: bash
        run: |
          set -euo pipefail

          cd release-artifact

          test -s "${RELEASE_APK_NAME}"
          sha256sum --check "${RELEASE_APK_NAME}.sha256"
          unzip -t "${RELEASE_APK_NAME}" >/dev/null

      - name: Publish the canonical APK to the stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd release-artifact

          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null

          gh release upload "${RELEASE_TAG}" \
            "${RELEASE_APK_NAME}" \
            "${RELEASE_APK_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Verify published APK size and SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,assets
          )"

          test "$(
            echo "${RELEASE_JSON}" |
              jq -r '.tagName'
          )" = "${RELEASE_TAG}"

          PUBLISHED_COUNT="$(
            echo "${RELEASE_JSON}" |
              jq --arg name "${RELEASE_APK_NAME}" \
                '[.assets[] | select(.name == $name)] | length'
          )"

          test "${PUBLISHED_COUNT}" -eq 1

          EXPECTED_SIZE="$(
            stat -c%s "release-artifact/${RELEASE_APK_NAME}"
          )"

          PUBLISHED_SIZE="$(
            echo "${RELEASE_JSON}" |
              jq --arg name "${RELEASE_APK_NAME}" \
                -r '.assets[] | select(.name == $name) | .size'
          )"

          test "${PUBLISHED_SIZE}" = "${EXPECTED_SIZE}"

          PUBLISHED_SHA="$(
            echo "${RELEASE_JSON}" |
              jq --arg name "${RELEASE_APK_NAME}" \
                -r '.assets[] | select(.name == $name) | .digest' |
              sed 's/^sha256://'
          )"

          EXPECTED_SHA="$(
            awk '{print $1}' \
              "release-artifact/${RELEASE_APK_NAME}.sha256"
          )"

          test -n "${PUBLISHED_SHA}"
          test "${PUBLISHED_SHA}" = "${EXPECTED_SHA}"

          {
            echo "## Canonical APK publication verified"
            echo
            echo "- Source branch: ${GITHUB_REF_NAME}"
            echo "- Release tag: ${RELEASE_TAG}"
            echo "- APK: ${RELEASE_APK_NAME}"
            echo "- Size: ${PUBLISHED_SIZE} bytes"
            echo "- SHA-256: ${PUBLISHED_SHA}"
            echo "- Worker deployment: NO"
          } >> "${GITHUB_STEP_SUMMARY}"

  publication-not-requested:
    name: Confirm no release was published
    needs: build-test-verify
    if: ${{ inputs.publish_release != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Record safe default
        shell: bash
        run: |
          {
            echo "## Safe default: APK was not published"
            echo
            echo "The verified APK is available only as a workflow artifact."
            echo "The stable GitHub Release was not modified."
            echo "No Worker was deployed."
          } >> "${GITHUB_STEP_SUMMARY}"
