
name: Sa7bi AI Branch Verification APK

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - ".github/workflows/verify-release-branch.yml"
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-branch-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: "1.0.1"
  EXPECTED_APPLICATION_ID: "com.example.sa7bi_ai_new"
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"
  APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"

jobs:
  verify-and-build:
    name: Analyze, test, build, and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "Expected app version: ${APP_VERSION}"
            echo "Expected package ID: ${EXPECTED_APPLICATION_ID}"
            echo
            flutter --version
            dart --version
            java -version
          } 2>&1 | tee build-provenance.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze whole Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos 2>&1 | tee flutter-analyze-report.txt

      - name: Run network lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          test -f test/sa7bi_network_client_lifecycle_test.dart
          flutter test --no-pub --reporter expanded \
            test/sa7bi_network_client_lifecycle_test.dart \
            2>&1 | tee network-client-test-report.txt

      - name: Build release APK from this exact commit
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          SOURCE_ID="${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          flutter build apk --release \
            --build-name="${APP_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define="SA7BI_APP_VERSION=${APP_VERSION}" \
            --dart-define="SA7BI_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" \
            --dart-define="SA7BI_COMMIT_SHA=${GITHUB_SHA}" \
            --dart-define="APP_BUILD_ID=${BUILD_ID}" \
            --dart-define="APP_SOURCE_ID=${SOURCE_ID}"

      - name: Verify APK package, version, size, and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="${APK_PATH}"
          test -s "${APK}" || {
            echo "ERROR: APK missing or empty"
            exit 1
          }

          APK_ANALYZER="$(
            find "${ANDROID_HOME}" -type f \
              -name apkanalyzer -perm -u+x 2>/dev/null |
              head -n 1
          )"

          if [ -z "${APK_ANALYZER}" ]; then
            echo "ERROR: Android apkanalyzer was not found."
            exit 1
          fi

          ACTUAL_ID="$("${APK_ANALYZER}" manifest application-id "${APK}")"
          ACTUAL_VERSION="$("${APK_ANALYZER}" manifest version-name "${APK}")"
          ACTUAL_CODE="$("${APK_ANALYZER}" manifest version-code "${APK}")"
          APK_BYTES="$(stat -c%s "${APK}")"
          APK_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"

          echo "Application ID: ${ACTUAL_ID}"
          echo "Version name: ${ACTUAL_VERSION}"
          echo "Version code: ${ACTUAL_CODE}"
          echo "APK bytes: ${APK_BYTES}"
          echo "APK SHA-256: ${APK_SHA256}"

          if [ "${ACTUAL_ID}" != "${EXPECTED_APPLICATION_ID}" ]; then
            echo "ERROR: Wrong APK application ID."
            exit 1
          fi

          if [ "${ACTUAL_VERSION}" != "${APP_VERSION}" ]; then
            echo "ERROR: Wrong APK version name."
            exit 1
          fi

          if [ "${ACTUAL_CODE}" != "${GITHUB_RUN_NUMBER}" ]; then
            echo "ERROR: APK version code differs from workflow run."
            exit 1
          fi

          if [ "${APK_BYTES}" -le 1000000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          if ! unzip -l "${APK}" | grep -q 'libapp.so'; then
            echo "ERROR: Flutter compiled library is missing."
            exit 1
          fi

          {
            echo
            echo "APK verification:"
            echo "APK path: ${APK}"
            echo "Application ID: ${ACTUAL_ID}"
            echo "Version name: ${ACTUAL_VERSION}"
            echo "Version code: ${ACTUAL_CODE}"
            echo "APK bytes: ${APK_BYTES}"
            echo "APK SHA-256: ${APK_SHA256}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Build ID: run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            echo "Source ID: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          } | tee -a build-provenance.txt

          sha256sum "${APK}" > app-release.apk.sha256

      - name: Upload verified APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-ai-verified-release-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build-provenance.txt
            app-release.apk.sha256
            flutter-analyze-report.txt
            network-client-test-report.txt
          if-no-files-found: error
          retention-days: 14
