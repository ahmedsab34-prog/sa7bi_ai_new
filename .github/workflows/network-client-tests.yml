
name: Sa7bi AI Network Client Tests

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - ".github/workflows/network-client-tests.yml"
      - "lib/services/sa7bi_network_client.dart"
      - "lib/config/app_config.dart"
      - "test/sa7bi_network_client_lifecycle_test.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-client-tests:
    name: Test Network Client Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check network lifecycle test exists
        run: |
          test -f test/sa7bi_network_client_lifecycle_test.dart

      - name: Run network client lifecycle tests
        run: |
          flutter test --reporter expanded \
            test/sa7bi_network_client_lifecycle_test.dart
