
name: Sa7bi AI - Branch Verification

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/network-client-tests.yml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"

  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/network-client-tests.yml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify network test exists
        run: |
          test -f test/sa7bi_network_client_lifecycle_test.dart

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run all Flutter tests
        run: flutter test --reporter expanded

  android-debug-build:
    name: Verify Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
