
name: Sa7bi AI - Branch Verification

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/network-client-tests.yml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"

  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/network-client-tests.yml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify network test exists
        run: test -f test/sa7bi_network_client_lifecycle_test.dart

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run all Flutter tests
        run: flutter test --reporter expanded

  android-debug-build:
    name: Verify Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read version and build identity
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LINE="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"

          if [ -z "$VERSION_LINE" ] || [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "ERROR: Could not read version from pubspec.yaml"
            exit 1
          fi

          BUILD_NUMBER="${VERSION_CODE}.${GITHUB_RUN_NUMBER}"
          BUILD_ID="${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"

          {
            echo "SA7BI_APP_VERSION=$VERSION_NAME"
            echo "SA7BI_BUILD_NUMBER=$BUILD_NUMBER"
            echo "SA7BI_COMMIT_SHA=$GITHUB_SHA"
            echo "APP_BUILD_ID=$BUILD_ID"
            echo "APP_SOURCE_ID=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

          {
            echo "App version: $VERSION_NAME"
            echo "Build number: $BUILD_NUMBER"
            echo "Build ID: $BUILD_ID"
            echo "Source commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run ID: $GITHUB_RUN_ID"
          } | tee build-identity-input.txt

      - name: Increase Gradle heap
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/-Xmx2048M/-Xmx4G -XX:MaxMetaspaceSize=1G/' android/gradle.properties
          grep '^org.gradle.jvmargs=' android/gradle.properties

      - name: Build Android debug APK with identity
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --debug --no-pub \
            --dart-define="SA7BI_APP_VERSION=$SA7BI_APP_VERSION" \
            --dart-define="SA7BI_BUILD_NUMBER=$SA7BI_BUILD_NUMBER" \
            --dart-define="SA7BI_COMMIT_SHA=$SA7BI_COMMIT_SHA" \
            --dart-define="APP_BUILD_ID=$APP_BUILD_ID" \
            --dart-define="APP_SOURCE_ID=$APP_SOURCE_ID"

      - name: Verify APK exists and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created or is empty."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')

          echo "APK_PATH=$APK"
          echo "APK_SIZE=$APK_SIZE"
          echo "APK_SHA256=$APK_SHA256"

          {
            echo "APK_SIZE=$APK_SIZE"
            echo "APK_SHA256=$APK_SHA256"
          } >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-ai-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create build identity report
        if: always()
        shell: bash
        run: |
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "App version: ${SA7BI_APP_VERSION:-not-injected}"
            echo "Build number: ${SA7BI_BUILD_NUMBER:-not-injected}"
            echo "App build ID: ${APP_BUILD_ID:-not-injected}"
            echo "App source ID: ${APP_SOURCE_ID:-not-injected}"
            echo "APK path: build/app/outputs/flutter-apk/app-debug.apk"
            echo "APK size: ${APK_SIZE:-not-built}"
            echo "APK SHA256: ${APK_SHA256:-not-built}"
          } > build-identity-report.txt

      - name: Upload build identity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-ai-build-report-${{ github.run_id }}
          path: |
            build-identity-report.txt
            build-identity-input.txt
          if-no-files-found: warn
          retention-days: 7
