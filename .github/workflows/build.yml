name: Sa7bi AI - Backend Worker Deployment (Manual Approval Only)

on:
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: "Set true only after explicitly approving deployment of the primary and fallback Workers."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sa7bi-backend-worker-deployment
  cancel-in-progress: false

env:
  WORKER_URL: "https://sa7bi-ai-new.ahmedsab34.workers.dev"
  FALLBACK_WORKER_URL: "https://sa7bi-ai-new-fallback.ahmedsab34.workers.dev"

jobs:
  deploy-workers:
    name: Deploy and verify backend Workers after explicit approval
    if: ${{ inputs.deploy_workers == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout the selected source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restrict Worker deployment to main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Production Worker deployment is allowed only from main, after the changes have been reviewed and approved."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Approved source commit: ${GITHUB_SHA}"

      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          }

          test -n "${CLOUDFLARE_ACCOUNT_ID}" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "::error::backend/package.json was not found."
            exit 1
          fi

      - name: Deploy primary Worker
        working-directory: backend
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml

      - name: Verify primary Worker health
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            "${WORKER_URL}/health"

          echo
          echo "Primary Worker health check passed."

      - name: Deploy fallback Worker
        working-directory: backend
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler-fallback.toml

      - name: Verify fallback Worker health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            rm -f /tmp/sa7bi-fallback-headers.txt
            rm -f /tmp/sa7bi-fallback-body.txt

            status="$(
              curl --silent --show-error --location \
                --connect-timeout 15 --max-time 45 \
                --dump-header /tmp/sa7bi-fallback-headers.txt \
                --output /tmp/sa7bi-fallback-body.txt \
                --write-out "%{http_code}" \
                "${FALLBACK_WORKER_URL}/health" || true
            )"

            if [ "${status}" = "200" ] &&
               grep -qi "^x-sa7bi-network-fallback:" \
                 /tmp/sa7bi-fallback-headers.txt &&
               grep -q '"ok":true' /tmp/sa7bi-fallback-body.txt; then
              cat /tmp/sa7bi-fallback-body.txt
              echo
              echo "Fallback Worker health check passed."
              exit 0
            fi

            echo "Fallback health attempt ${attempt}/12 returned ${status}."
            if [ "${attempt}" -lt 12 ]; then
              sleep 5
            fi
          done

          echo "::error::Fallback Worker health verification failed."
          cat /tmp/sa7bi-fallback-headers.txt 2>/dev/null || true
          cat /tmp/sa7bi-fallback-body.txt 2>/dev/null || true
          exit 1

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Backend Worker deployment verified"
            echo
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Primary Worker: ${WORKER_URL}"
            echo "- Fallback Worker: ${FALLBACK_WORKER_URL}"
            echo "- APK build/publish: not performed by this workflow"
          } >> "${GITHUB_STEP_SUMMARY}"

  deployment-not-approved:
    name: Confirm no Worker deployment was requested
    if: ${{ inputs.deploy_workers != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record safe default
        shell: bash
        run: |
          {
            echo "## Safe default: no Worker deployment"
            echo
            echo "The deploy_workers input was false."
            echo "Neither primary nor fallback Worker was changed."
          } >> "${GITHUB_STEP_SUMMARY}"
