name: Build Flutter APK + Deploy Cloudflare Worker

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show toolchain versions
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== FLUTTER ====="
          flutter --version

          echo "===== GRADLE ====="
          gradle --version

      - name: Clean Flutter build
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        continue-on-error: true
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check Wrangler
        working-directory: backend
        run: npx wrangler --version

      - name: Deploy Cloudflare Worker
        working-directory: backend
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ============================================================
      # LIVE WORKER SMOKE TEST
      #
      # هذا الاختبار لا يغير الـWorker.
      # فقط يتأكد أن الرابط المنشور قابل للوصول فعليًا
      # من خارج الهاتف وبعد انتهاء عملية النشر.
      # ============================================================

      - name: Wait for Worker propagation
        run: |
          echo "Waiting for Cloudflare Worker propagation..."
          sleep 8

      - name: Test live Worker health endpoint
        env:
          WORKER_URL: https://sa7bi-ai-new.ahmedsab34.workers.dev
        run: |
          set -e

          echo "=========================================="
          echo "Testing live Sa7bi AI Worker"
          echo "=========================================="
          echo "URL: ${WORKER_URL}/health"

          SUCCESS=0

          for ATTEMPT in 1 2 3 4 5 6; do
            echo ""
            echo "Attempt ${ATTEMPT}/6"

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --output /tmp/sa7bi-health.json \
              --write-out "%{http_code}" \
              "${WORKER_URL}/health" || true)

            echo "HTTP status: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then
              echo ""
              echo "===== WORKER RESPONSE ====="
              cat /tmp/sa7bi-health.json
              echo ""
              echo "===== WORKER IS REACHABLE ====="
              SUCCESS=1
              break
            fi

            echo "Worker is not reachable yet."
            sleep 5
          done

          if [ "${SUCCESS}" != "1" ]; then
            echo ""
            echo "=========================================="
            echo "WORKER LIVE HEALTH CHECK FAILED"
            echo "=========================================="
            echo "Deployment itself succeeded, but the public"
            echo "workers.dev endpoint did not return HTTP 200."
            echo ""
            echo "This points to a routing/edge/public-endpoint"
            echo "problem rather than a Flutter build problem."
            exit 1
          fi

      - name: Test Worker root endpoint
        env:
          WORKER_URL: https://sa7bi-ai-new.ahmedsab34.workers.dev
        run: |
          set -e

          echo "Testing Worker root endpoint..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/sa7bi-root.json \
            --write-out "%{http_code}" \
            "${WORKER_URL}/" || true)

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Root endpoint failed."
            cat /tmp/sa7bi-root.json 2>/dev/null || true
            exit 1
          fi

          echo "===== ROOT RESPONSE ====="
          cat /tmp/sa7bi-root.json
          echo ""

      - name: Test Worker diagnostics endpoint
        env:
          WORKER_URL: https://sa7bi-ai-new.ahmedsab34.workers.dev
        run: |
          set -e

          echo "Testing Worker diagnostics endpoint..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/sa7bi-diagnostics.json \
            --write-out "%{http_code}" \
            "${WORKER_URL}/v1/diagnostics" || true)

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Diagnostics endpoint failed."
            cat /tmp/sa7bi-diagnostics.json 2>/dev/null || true
            exit 1
          fi

          echo "===== DIAGNOSTICS RESPONSE ====="
          cat /tmp/sa7bi-diagnostics.json
          echo ""

      - name: Worker deployment verification complete
        run: |
          echo ""
          echo "=========================================="
          echo "SA7BI AI WORKER VERIFICATION COMPLETE"
          echo "=========================================="
          echo "Deployment succeeded."
          echo "Public endpoint responded successfully."
          echo "Health endpoint responded."
          echo "Root endpoint responded."
          echo "Diagnostics endpoint responded."
          echo "=========================================="
