
name: Sa7bi AI - Legacy Worker Deployment Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Legacy deployment disabled - use the unified verified release workflow
    runs-on: ubuntu-latest
    steps:
      - name: Explain the official deployment path
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## No deployment performed"
            echo
            echo "This legacy workflow is intentionally disabled."
            echo "Do not deploy Workers from this workflow."
            echo "Use verify-release-branch.yml as the single official release workflow."
            echo "That workflow verifies the APK, Primary Worker, Fallback Worker, and stable release identity."
            echo "No Worker or APK release was changed by this run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Legacy deployment disabled. No production changes were made."
