name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: false

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Android Manifest configuration
      run: |
        sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@android:drawable\/sym_def_app_icon"/.g' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:theme="@style\/LaunchTheme"/android:theme="@android:style\/Theme.NoTitleBar"/.g' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:theme="@style\/NormalTheme"/android:theme="@android:style\/Theme.NoTitleBar"/.g' android/app/src/main/AndroidManifest.xml

    - name: Build Release APK
      run: flutter build apk --release
