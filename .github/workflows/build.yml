name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Clean Flutter Project and Inject Code
        run: |
          # الاحتفاظ بملفات الكود والملفات المهمة
          mkdir -p temp_lib temp_pubspec
          cp -r lib/* temp_lib/
          cp pubspec.yaml temp_pubspec/
          
          # إنشاء مشروع فلاتر جديد نظيف بالكامل وبالبنية الصحيحة
          flutter create . --org com.sa7bi.ai --project-name sa7bi_app --force
          
          # استعادة ملفاتنا وملف الـ pubspec الخاص بنا
          rm -rf lib/*
          cp -r temp_lib/* lib/
          cp temp_pubspec/pubspec.yaml ./
          
          # تنظيف الملفات المؤقتة
          rm -rf temp_lib temp_pubspec

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
