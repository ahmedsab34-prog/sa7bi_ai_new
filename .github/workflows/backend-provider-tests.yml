name: Sa7bi AI - Backend Provider and Route Tests

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - ".github/workflows/backend-provider-tests.yml"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-backend-provider-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Test Backend Providers and Worker Routes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify branch and source identity
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_BRANCH="fix/build-692-network-client-lifecycle"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]; then
            echo "::error::Backend tests are restricted to ${EXPECTED_BRANCH}."
            exit 1
          fi

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-package-lock \
            --no-audit \
            --no-fund

      - name: Run all backend checks and provider tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run check
