name: Sa7bi AI - Android UI Smoke Test

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ui-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-android-ui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-smoke:
    name: Run app screens on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      EXPECTED_BRANCH: "fix/build-692-network-client-lifecycle"
      FLUTTER_VERSION: "3.38.1"
      ANDROID_SERIAL: "emulator-5554"

    steps:
      - name: Checkout the intended branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch: ${EXPECTED_BRANCH}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Prepare Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "Android SDK components are ready."

      - name: Warm Gradle and Flutter build cache
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --debug --no-pub

          test -f build/app/outputs/flutter-apk/app-debug.apk

          echo "Debug APK built successfully."

      - name: Enable KVM permissions
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM is not available on this runner."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

          ls -l /dev/kvm

      - name: Prepare Android UI smoke script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh" <<'BASH'
          #!/usr/bin/env bash

          set -Eeuo pipefail

          SERIAL="${ANDROID_SERIAL:-emulator-5554}"
          LOGCAT_PID=""

          mkdir -p emulator-diagnostics
          : > android-ui-smoke.log

          stop_logcat_capture() {
            if [[ -n "$LOGCAT_PID" ]]; then
              kill "$LOGCAT_PID" 2>/dev/null || true
              wait "$LOGCAT_PID" 2>/dev/null || true
              LOGCAT_PID=""
            fi
          }

          collect_diagnostics() {
            local status="${1:-1}"

            echo "Collecting Android emulator diagnostics."
            echo "Exit code: ${status}"

            stop_logcat_capture

            timeout 8s adb devices -l \
              > emulator-diagnostics/adb-devices.txt 2>&1 || true

            timeout 10s adb -s "$SERIAL" get-state \
              > emulator-diagnostics/adb-device-state.txt 2>&1 || true

            timeout 12s adb -s "$SERIAL" logcat -d -v threadtime \
              > emulator-diagnostics/android-logcat-final.txt 2>&1 || true

            ps auxww \
              > emulator-diagnostics/host-processes.txt 2>&1 || true

            pgrep -af 'emulator|qemu-system|adb' \
              > emulator-diagnostics/emulator-processes.txt 2>&1 || true

            free -h \
              > emulator-diagnostics/host-memory.txt 2>&1 || true

            df -h "$GITHUB_WORKSPACE" \
              > emulator-diagnostics/host-disk.txt 2>&1 || true

            uptime \
              > emulator-diagnostics/host-uptime.txt 2>&1 || true

            timeout 6s sudo dmesg -T 2>&1 | tail -n 200 \
              > emulator-diagnostics/host-kernel-tail.txt || true

            echo "$status" > emulator-diagnostics/exit-code.txt
          }

          on_error() {
            local status="$?"
            trap - ERR
            collect_diagnostics "$status"
            exit "$status"
          }

          trap on_error ERR

          wait_for_online_device() {
            local max_seconds="$1"
            local deadline=$((SECONDS + max_seconds))
            local state=""
            local boot_status=""

            while (( SECONDS < deadline )); do
              adb start-server >/dev/null 2>&1 || true

              state="$(
                timeout 8s adb -s "$SERIAL" get-state \
                  2>/dev/null || true
              )"

              if [[ "$state" == "device" ]]; then
                boot_status="$(
                  timeout 8s adb -s "$SERIAL" shell \
                    getprop sys.boot_completed \
                    2>/dev/null | tr -d '\r' || true
                )"

                if [[ "$boot_status" == "1" ]]; then
                  echo "Android emulator is online and fully booted."
                  return 0
                fi
              fi

              echo "Waiting for emulator. ADB state: ${state:-unavailable}"
              sleep 3
            done

            echo "::error::Android emulator did not become ready."
            return 1
          }

          recover_existing_emulator() {
            echo "Attempting safe ADB recovery on the existing emulator."

            # Do not kill the emulator process.
            # Do not launch another QEMU process.
            adb reconnect offline >/dev/null 2>&1 || true
            adb start-server >/dev/null 2>&1 || true

            wait_for_online_device 45
          }

          run_integration_test() {
            local attempt=1
            local max_attempts=2
            local test_status=0
            local device_state=""
            local transport_failure="false"
            local -a pipeline_status=()

            while (( attempt <= max_attempts )); do
              echo "Starting integration test ${attempt}/${max_attempts}."

              set +e

              timeout --signal=TERM --kill-after=20s 10m \
                flutter test \
                  integration_test/sa7bi_app_smoke_test.dart \
                  --no-pub \
                  -d "$SERIAL" \
                  --reporter expanded \
                  2>&1 | tee -a android-ui-smoke.log

              pipeline_status=("${PIPESTATUS[@]}")
              test_status="${pipeline_status[0]:-1}"

              set -e

              if [[ "$test_status" -eq 0 ]]; then
                device_state="$(
                  timeout 8s adb -s "$SERIAL" get-state \
                    2>/dev/null || true
                )"

                if [[ "$device_state" == "device" ]]; then
                  echo "Flutter integration test passed."
                  return 0
                fi

                echo "Test finished but the emulator connection was lost."
                test_status=1
              fi

              device_state="$(
                timeout 8s adb -s "$SERIAL" get-state \
                  2>/dev/null || true
              )"

              transport_failure="false"

              if [[ "$device_state" != "device" ]] ||
                 grep -Eqi \
                   'device offline|device .* offline|lost connection to device|no devices/emulators found|adb.*offline' \
                   android-ui-smoke.log; then
                transport_failure="true"
              fi

              if [[ "$transport_failure" != "true" ]]; then
                echo "::error::Flutter test failed without an ADB transport failure."
                return "$test_status"
              fi

              if (( attempt >= max_attempts )); then
                echo "::error::ADB recovery retry limit reached."
                return "$test_status"
              fi

              echo "ADB transport failure detected."

              if ! recover_existing_emulator; then
                echo "::error::Existing emulator could not be recovered."
                return "$test_status"
              fi

              attempt=$((attempt + 1))
            done

            return "$test_status"
          }

          echo "Waiting for Android emulator..."
          wait_for_online_device 180

          timeout 8s adb -s "$SERIAL" shell svc power stayon true || true
          timeout 8s adb -s "$SERIAL" logcat -c || true

          adb -s "$SERIAL" logcat -v threadtime \
            > emulator-diagnostics/android-logcat-live.txt 2>&1 &
          LOGCAT_PID="$!"

          sleep 2

          echo "Emulator information:"
          adb devices -l
          adb -s "$SERIAL" shell getprop ro.build.version.release
          adb -s "$SERIAL" shell getprop ro.product.model

          echo "Starting Sa7bi AI UI smoke test."

          if run_integration_test; then
            stop_logcat_capture
            echo "Android UI smoke test completed successfully."
          else
            test_status="$?"
            collect_diagnostics "$test_status"
            exit "$test_status"
          fi
          BASH

          chmod +x "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"
          bash -n "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

          echo "Android UI script syntax validation passed."

      - name: Run UI checks on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu software
            -no-snapshot
            -noaudio
            -no-boot-anim
            -memory 3072
          script: bash "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

      - name: Upload Android UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-android-ui-smoke-diagnostics
          path: |
            android-ui-smoke.log
            emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14
