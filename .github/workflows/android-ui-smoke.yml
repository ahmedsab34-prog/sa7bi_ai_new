
name: Sa7bi AI - Android UI Smoke Test

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-android-ui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-smoke:
    name: Build app and run Android emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      EXPECTED_BRANCH: fix/build-692-network-client-lifecycle
      FLUTTER_VERSION: "3.38.1"
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Checkout intended branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure repositories for Flutter's included Gradle build
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_SETTINGS="${FLUTTER_ROOT}/packages/flutter_tools/gradle/settings.gradle.kts"
          test -f "${FLUTTER_SETTINGS}"

          if ! grep -q '^pluginManagement {' "${FLUTTER_SETTINGS}"; then
            TEMP_SETTINGS="$(mktemp)"
            cat > "${TEMP_SETTINGS}" <<'KOTLIN'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          KOTLIN
            cat "${FLUTTER_SETTINGS}" >> "${TEMP_SETTINGS}"
            mv "${TEMP_SETTINGS}" "${FLUTTER_SETTINGS}"
          fi

          grep -q 'google()' "${FLUTTER_SETTINGS}"
          grep -q 'mavenCentral()' "${FLUTTER_SETTINGS}"
          echo "Flutter included-build repositories are configured."
          sed -n '1,80p' "${FLUTTER_SETTINGS}"

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          test -s pubspec.lock

      - name: Validate Dart source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run classic and animated sticker tests
        shell: bash
        run: |
          set -euo pipefail
          test -f test/social_sticker_test.dart
          test -f test/sa7bi_hero_chat_sticker_test.dart

          flutter test test/social_sticker_test.dart \
            --no-pub \
            --reporter expanded

          flutter test test/sa7bi_hero_chat_sticker_test.dart \
            --no-pub \
            --reporter expanded

      - name: Prepare Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          "${SDKMANAGER}" --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "Debug APK build passed."

      - name: Enable KVM permissions
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM is not available on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run Android integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-port: 5554
          disable-linux-hw-accel: false
          disable-animations: true
          force-avd-creation: true
          avd-name: sa7bi-ui-smoke
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            set -uo pipefail
            DIAG_DIR="build/android-ui-smoke"
            SERIAL="emulator-5554"
            mkdir -p "${DIAG_DIR}"

            capture_host_state() {
              {
                echo "===== UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
                echo "===== adb devices ====="
                adb devices -l
                echo "===== host memory ====="
                free -h
                echo "===== host disk ====="
                df -h
                echo "===== emulator processes ====="
                ps -eo pid,ppid,%mem,%cpu,rss,stat,etime,args | grep -E '[e]mulator|[q]emu|[a]db'
              } >> "${DIAG_DIR}/host-state.txt" 2>&1
            }

            capture_device_state() {
              local label="$1"
              echo "===== ${label} =====" >> "${DIAG_DIR}/device-state.txt"
              timeout 25 adb -s "${SERIAL}" get-state >> "${DIAG_DIR}/device-state.txt" 2>&1 || true
              timeout 25 adb -s "${SERIAL}" shell getprop >> "${DIAG_DIR}/device-state.txt" 2>&1 || true
              timeout 25 adb -s "${SERIAL}" shell dumpsys meminfo >> "${DIAG_DIR}/meminfo-${label}.txt" 2>&1 || true
              timeout 25 adb -s "${SERIAL}" shell dumpsys activity processes >> "${DIAG_DIR}/processes-${label}.txt" 2>&1 || true
            }

            stop_background_capture() {
              if [[ -n "${MONITOR_PID:-}" ]]; then
                kill "${MONITOR_PID}" 2>/dev/null || true
                wait "${MONITOR_PID}" 2>/dev/null || true
                MONITOR_PID=""
              fi
              if [[ -n "${LOGCAT_PID:-}" ]]; then
                kill "${LOGCAT_PID}" 2>/dev/null || true
                wait "${LOGCAT_PID}" 2>/dev/null || true
                LOGCAT_PID=""
              fi
            }

            finish_diagnostics() {
              local result_code="$?"
              trap - EXIT
              stop_background_capture
              echo "Integration test exit code: ${result_code}" > "${DIAG_DIR}/test-exit-code.txt"
              capture_host_state
              capture_device_state "final"
              timeout 30 adb -s "${SERIAL}" logcat -d -b all -v threadtime > "${DIAG_DIR}/logcat-final.txt" 2>&1 || true
              exit "${result_code}"
            }
            trap finish_diagnostics EXIT

            echo "===== Emulator readiness ====="
            adb devices -l | tee "${DIAG_DIR}/adb-devices-before.txt"
            adb -s "${SERIAL}" shell getprop sys.boot_completed | grep -q '^1$'
            adb -s "${SERIAL}" shell svc power stayon true
            capture_host_state
            capture_device_state "before-test"

            adb -s "${SERIAL}" logcat -b all -v threadtime > "${DIAG_DIR}/logcat-live.txt" 2>&1 &
            LOGCAT_PID="$!"

            (
              while true; do
                printf '\n===== %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "${DIAG_DIR}/adb-watch.txt"
                if ! adb -s "${SERIAL}" get-state 2>&1 | tee -a "${DIAG_DIR}/adb-watch.txt" | grep -qx 'device'; then
                  echo "ADB device became unavailable." >> "${DIAG_DIR}/adb-watch.txt"
                  adb devices -l >> "${DIAG_DIR}/adb-watch.txt" 2>&1 || true
                  free -h >> "${DIAG_DIR}/adb-watch.txt" 2>&1 || true
                  ps -eo pid,ppid,%mem,%cpu,rss,stat,etime,args | grep -E '[e]mulator|[q]emu|[a]db' >> "${DIAG_DIR}/adb-watch.txt" 2>&1 || true
                  break
                fi
                sleep 5
              done
            ) &
            MONITOR_PID="$!"

            set +e
            flutter test integration_test/sa7bi_app_smoke_test.dart \
              --no-pub \
              -d "${SERIAL}" \
              --reporter expanded 2>&1 | tee "${DIAG_DIR}/flutter-integration-test.txt"
            TEST_EXIT="${PIPESTATUS[0]}"
            set -e

            echo "Flutter integration test exit code: ${TEST_EXIT}"
            if [[ "${TEST_EXIT}" -ne 0 ]]; then
              echo "Test failed; collecting failure-time diagnostics."
              capture_host_state
              capture_device_state "failure"
              timeout 30 adb -s "${SERIAL}" logcat -d -b all -v threadtime > "${DIAG_DIR}/logcat-at-failure.txt" 2>&1 || true
              adb devices -l > "${DIAG_DIR}/adb-devices-at-failure.txt" 2>&1 || true
            fi

            exit "${TEST_EXIT}"

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-android-ui-smoke-diagnostics
          path: build/android-ui-smoke/
          if-no-files-found: warn
          retention-days: 7
