name: Sa7bi AI - Android UI Smoke Test

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ui-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-android-ui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-smoke:
    name: Run app screens on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      EXPECTED_BRANCH: "fix/build-692-network-client-lifecycle"
      FLUTTER_VERSION: "3.38.1"
      ANDROID_SERIAL: "emulator-5554"

    steps:
      - name: Checkout the intended branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch: ${EXPECTED_BRANCH}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Prepare Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "Android SDK components are ready."

      - name: Warm Gradle and Flutter build cache
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo "Debug APK built successfully."

      - name: Run Sa7bi sticker tests explicitly
        shell: bash
        run: |
          set -euo pipefail
          test -f test/social_sticker_test.dart
          flutter test test/social_sticker_test.dart \
            --no-pub \
            --reporter expanded
          echo "Sa7bi sticker tests passed explicitly."

      - name: Enable KVM permissions
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM is not available on this runner."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Prepare Android UI smoke script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          SERIAL="${ANDROID_SERIAL:-emulator-5554}"
          ATTEMPT="${SMOKE_ATTEMPT:-1}"
          LOGCAT_PID=""
          TEST_LOG="android-ui-smoke-attempt-${ATTEMPT}.log"
          DIAG_DIR="emulator-diagnostics/attempt-${ATTEMPT}"

          mkdir -p "$DIAG_DIR"
          : > "$TEST_LOG"

          write_failure_reason() {
            local reason="$1"
            if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
              echo "failure_reason=${reason}" >> "$GITHUB_OUTPUT"
            fi
          }

          stop_logcat_capture() {
            if [[ -n "$LOGCAT_PID" ]]; then
              kill "$LOGCAT_PID" 2>/dev/null || true
              wait "$LOGCAT_PID" 2>/dev/null || true
              LOGCAT_PID=""
            fi
          }

          collect_diagnostics() {
            local status="${1:-1}"

            echo "Collecting Android emulator diagnostics for attempt ${ATTEMPT}."
            echo "Exit code: ${status}"

            stop_logcat_capture

            timeout 8s adb devices -l \
              > "${DIAG_DIR}/adb-devices.txt" 2>&1 || true

            timeout 10s adb -s "$SERIAL" get-state \
              > "${DIAG_DIR}/adb-device-state.txt" 2>&1 || true

            timeout 12s adb -s "$SERIAL" logcat -d -v threadtime \
              > "${DIAG_DIR}/android-logcat-final.txt" 2>&1 || true

            ps auxww \
              > "${DIAG_DIR}/host-processes.txt" 2>&1 || true

            pgrep -af 'emulator|qemu-system|adb' \
              > "${DIAG_DIR}/emulator-processes.txt" 2>&1 || true

            free -h \
              > "${DIAG_DIR}/host-memory.txt" 2>&1 || true

            df -h "$GITHUB_WORKSPACE" \
              > "${DIAG_DIR}/host-disk.txt" 2>&1 || true

            uptime \
              > "${DIAG_DIR}/host-uptime.txt" 2>&1 || true

            timeout 6s sudo dmesg -T 2>&1 | tail -n 250 \
              > "${DIAG_DIR}/host-kernel-tail.txt" || true

            echo "$status" > "${DIAG_DIR}/exit-code.txt"
          }

          on_error() {
            local status="$?"
            local device_state=""

            trap - ERR

            device_state="$(
              timeout 8s adb -s "$SERIAL" get-state 2>/dev/null || true
            )"

            if [[ "$device_state" == "device" ]]; then
              write_failure_reason "script"
            else
              write_failure_reason "transport"
            fi

            collect_diagnostics "$status"
            exit "$status"
          }

          trap on_error ERR

          wait_for_online_device() {
            local max_seconds="$1"
            local deadline=$((SECONDS + max_seconds))
            local state=""
            local boot_status=""

            while (( SECONDS < deadline )); do
              adb start-server >/dev/null 2>&1 || true

              state="$(
                timeout 8s adb -s "$SERIAL" get-state 2>/dev/null || true
              )"

              if [[ "$state" == "device" ]]; then
                boot_status="$(
                  timeout 8s adb -s "$SERIAL" shell \
                    getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true
                )"

                if [[ "$boot_status" == "1" ]]; then
                  echo "Android emulator is online and fully booted."
                  return 0
                fi
              fi

              echo "Waiting for emulator. ADB state: ${state:-unavailable}"
              sleep 3
            done

            echo "::error::Android emulator did not become ready."
            return 1
          }

          echo "Waiting for Android emulator (attempt ${ATTEMPT})..."
          wait_for_online_device 180

          timeout 8s adb -s "$SERIAL" shell svc power stayon true || true
          timeout 8s adb -s "$SERIAL" logcat -c || true

          adb -s "$SERIAL" logcat -v threadtime \
            > "${DIAG_DIR}/android-logcat-live.txt" 2>&1 &
          LOGCAT_PID="$!"

          sleep 2

          echo "Emulator information:"
          adb devices -l
          adb -s "$SERIAL" shell getprop ro.build.version.release
          adb -s "$SERIAL" shell getprop ro.product.model

          echo "Starting Sa7bi AI integration tests (attempt ${ATTEMPT})."

          set +e
          timeout --signal=TERM --kill-after=20s 10m \
            flutter test \
              integration_test \
              --no-pub \
              -d "$SERIAL" \
              --reporter expanded \
              2>&1 | tee "$TEST_LOG"
          PIPELINE_STATUS=("${PIPESTATUS[@]}")
          set -e

          TEST_STATUS="${PIPELINE_STATUS[0]:-1}"

          if [[ "$TEST_STATUS" -ne 0 ]]; then
            DEVICE_STATE="$(
              timeout 8s adb -s "$SERIAL" get-state 2>/dev/null || true
            )"

            if [[ "$DEVICE_STATE" == "device" ]]; then
              write_failure_reason "test"
              echo "::error::Flutter integration test failed while ADB remained online."
            else
              write_failure_reason "transport"
              echo "::warning::The Android emulator/ADB transport disappeared during the UI test."
            fi

            collect_diagnostics "$TEST_STATUS"
            exit "$TEST_STATUS"
          fi

          DEVICE_STATE="$(
            timeout 8s adb -s "$SERIAL" get-state 2>/dev/null || true
          )"

          if [[ "$DEVICE_STATE" != "device" ]]; then
            write_failure_reason "transport"
            echo "::warning::The UI test returned success but the emulator connection was lost."
            collect_diagnostics 79
            exit 79
          fi

          stop_logcat_capture
          write_failure_reason "none"
          echo "Flutter integration tests passed on attempt ${ATTEMPT}."
          BASH

          chmod +x "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"
          bash -n "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"
          echo "Android UI script syntax validation passed."

      - name: Run Android UI smoke test - Mesa software renderer
        id: android_ui_attempt_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.35.0
        env:
          SMOKE_ATTEMPT: "1"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-port: 5554
          disable-linux-hw-accel: false
          disable-animations: true
          force-avd-creation: true
          avd-name: sa7bi-ui-smoke-lavapipe
          emulator-options: >-
            -no-window
            -gpu lavapipe
            -feature -Vulkan
            -no-snapshot
            -noaudio
            -no-boot-anim
          script: bash "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

      - name: Run Android UI smoke test - software fallback renderer
        id: android_ui_attempt_2
        if: >-
          steps.android_ui_attempt_1.outcome == 'failure' &&
          steps.android_ui_attempt_1.outputs.failure_reason != 'test'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.35.0
        env:
          SMOKE_ATTEMPT: "2"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-port: 5554
          disable-linux-hw-accel: false
          disable-animations: true
          force-avd-creation: true
          avd-name: sa7bi-ui-smoke-software
          emulator-options: >-
            -no-window
            -gpu software
            -feature -Vulkan
            -no-snapshot
            -noaudio
            -no-boot-anim
          script: bash "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

      - name: Require at least one successful Android UI run
        if: always()
        shell: bash
        env:
          FIRST_ATTEMPT: ${{ steps.android_ui_attempt_1.outcome }}
          SECOND_ATTEMPT: ${{ steps.android_ui_attempt_2.outcome }}
        run: |
          set -euo pipefail

          if [[ "${FIRST_ATTEMPT}" == "success" || "${SECOND_ATTEMPT}" == "success" ]]; then
            echo "At least one Android UI smoke attempt passed."
            exit 0
          fi

          echo "::error::Android UI smoke test did not pass on either emulator attempt."
          echo "First attempt: ${FIRST_ATTEMPT:-unknown}"
          echo "Second attempt: ${SECOND_ATTEMPT:-skipped}"
          exit 1

      - name: Upload Android UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-android-ui-smoke-diagnostics
          path: |
            android-ui-smoke-attempt-*.log
            emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14
