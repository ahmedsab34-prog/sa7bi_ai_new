name: Sa7bi AI - Android UI Smoke Test

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ui-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-android-ui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-smoke:
    name: Run app screens on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPECTED_BRANCH: "fix/build-692-network-client-lifecycle"
      FLUTTER_VERSION: "3.38.1"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout the intended branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'fix/build-692-network-client-lifecycle' }}
          fetch-depth: 1

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          fi

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Expected branch: ${EXPECTED_BRANCH}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Run UI checks on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail

            # Isolate the UI smoke test from live services.
            # No production writes or paid AI requests are allowed.
            adb shell settings put global airplane_mode_on 1 || true

            adb shell am broadcast \
              -a android.intent.action.AIRPLANE_MODE \
              --ez state true || true

            adb shell svc wifi disable || true
            adb shell svc data disable || true

            flutter test \
              integration_test/sa7bi_app_smoke_test.dart \
              --no-pub \
              -d emulator-5554 \
              --reporter expanded \
              2>&1 | tee android-ui-smoke.log

            {
              echo "## Android UI smoke test passed"
              echo
              echo "- Main navigation: Home, Chat, Games and Profile."
              echo "- Local games hub opened without creating an online match."
              echo "- Diagnostics screen opened."
              echo "- Automatic quick diagnostics was started and its first result was checked."
              echo "- Full diagnostics v5 was not triggered by this UI test."
              echo "- Emulator internet was disabled to prevent production writes."
              echo "- No paid AI inference, ad impression, social post or online match was requested."
              echo
              echo "This workflow checks UI startup and navigation. It does not prove all live services work."
            } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Android UI smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-android-ui-smoke-report
          path: android-ui-smoke.log
          if-no-files-found: ignore
          retention-days: 14
