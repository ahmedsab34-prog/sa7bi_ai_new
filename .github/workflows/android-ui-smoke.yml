name: Sa7bi AI - Android UI Smoke Test

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ui-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-android-ui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-smoke:
    name: Run app screens on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      EXPECTED_BRANCH: "fix/build-692-network-client-lifecycle"
      FLUTTER_VERSION: "3.38.1"
      ANDROID_SERIAL: "emulator-5554"

    steps:
      - name: Checkout the intended branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Expected branch: ${EXPECTED_BRANCH}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Enable KVM permissions for Android Emulator
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -e /dev/kvm ]]; then
            echo "ERROR: /dev/kvm is not available."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

          echo "KVM access is ready."
          ls -l /dev/kvm

      - name: Prepare Android UI smoke script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh" <<'BASH'
          #!/usr/bin/env bash

          set -Eeuo pipefail

          SERIAL="${ANDROID_SERIAL:-emulator-5554}"
          LOGCAT_PID=""

          mkdir -p emulator-diagnostics
          : > android-ui-smoke.log

          stop_logcat_capture() {
            if [[ -n "$LOGCAT_PID" ]]; then
              kill "$LOGCAT_PID" 2>/dev/null || true
              wait "$LOGCAT_PID" 2>/dev/null || true
              LOGCAT_PID=""
            fi
          }

          collect_failure() {
            local status="$1"
            trap - ERR

            echo "Collecting emulator diagnostics. Exit code: $status"
            stop_logcat_capture

            timeout 8s adb devices -l \
              > emulator-diagnostics/adb-devices.txt 2>&1 || true

            timeout 10s adb -s "$SERIAL" get-state \
              > emulator-diagnostics/adb-device-state.txt 2>&1 || true

            timeout 12s adb -s "$SERIAL" logcat -d -v threadtime \
              > emulator-diagnostics/android-logcat-final.txt 2>&1 || true

            ps auxww \
              > emulator-diagnostics/host-processes.txt 2>&1 || true

            pgrep -af 'emulator|qemu-system|adb' \
              > emulator-diagnostics/emulator-processes.txt 2>&1 || true

            free -h \
              > emulator-diagnostics/host-memory.txt 2>&1 || true

            df -h "$GITHUB_WORKSPACE" \
              > emulator-diagnostics/host-disk.txt 2>&1 || true

            uptime \
              > emulator-diagnostics/host-uptime.txt 2>&1 || true

            timeout 6s sudo dmesg -T 2>&1 | tail -n 200 \
              > emulator-diagnostics/host-kernel-tail.txt || true

            echo "$status" > emulator-diagnostics/exit-code.txt
            exit "$status"
          }

          trap 'collect_failure "$?"' ERR

          wait_for_online_device() {
            local max_seconds="$1"
            local deadline=$((SECONDS + max_seconds))
            local state=""
            local boot_status=""

            while (( SECONDS < deadline )); do
              adb start-server >/dev/null 2>&1 || true
              adb reconnect offline >/dev/null 2>&1 || true

              state="$(
                timeout 6s adb -s "$SERIAL" get-state 2>/dev/null || true
              )"

              if [[ "$state" == "device" ]]; then
                boot_status="$(
                  timeout 6s adb -s "$SERIAL" shell getprop sys.boot_completed \
                    2>/dev/null | tr -d '\r' || true
                )"

                if [[ "$boot_status" == "1" ]]; then
                  echo "Android device is online and booted."
                  return 0
                fi
              fi

              echo "Waiting for emulator. Current ADB state: ${state:-unavailable}"
              sleep 3
            done

            echo "ERROR: Emulator did not become ready."
            return 1
          }

          recover_adb() {
            echo "Attempting ADB recovery..."

            adb reconnect offline >/dev/null 2>&1 || true
            sleep 2

            local state=""
            state="$(
              timeout 8s adb -s "$SERIAL" get-state 2>/dev/null || true
            )"

            if [[ "$state" != "device" ]]; then
              adb kill-server >/dev/null 2>&1 || true
              sleep 2
              adb start-server >/dev/null 2>&1 || true
            fi

            wait_for_online_device 75
          }

          run_integration_test() {
            local attempt=1
            local max_attempts=2
            local test_status=0
            local device_state=""
            local offline_failure="false"

            while (( attempt <= max_attempts )); do
              echo "Starting integration test. Attempt ${attempt}/${max_attempts}"

              set +e
              timeout --signal=TERM --kill-after=20s 12m flutter test \
                integration_test/sa7bi_app_smoke_test.dart \
                --no-pub \
                -d "$SERIAL" \
                --reporter expanded \
                2>&1 | tee -a android-ui-smoke.log

              test_status="${PIPESTATUS[0]}"
              set -e

              if [[ "$test_status" -eq 0 ]]; then
                echo "Flutter integration test passed."
                return 0
              fi

              device_state="$(
                timeout 8s adb -s "$SERIAL" get-state 2>/dev/null || true
              )"

              offline_failure="false"

              if [[ "$device_state" != "device" ]] ||
                 grep -Eqi \
                 'device offline|device .* offline|lost connection to device|no devices/emulators found|adb.*offline' \
                 android-ui-smoke.log; then
                offline_failure="true"
              fi

              if [[ "$offline_failure" != "true" ]]; then
                echo "Flutter test failed without an ADB-offline indication."
                return "$test_status"
              fi

              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "ADB recovery retry limit reached."
                return "$test_status"
              fi

              echo "ADB transport failure detected. Recovering before one retry."

              if ! recover_adb; then
                echo "ADB recovery did not restore the emulator."
                return "$test_status"
              fi

              attempt=$((attempt + 1))
            done

            return "$test_status"
          }

          echo "Waiting for Android emulator..."
          wait_for_online_device 150

          timeout 8s adb -s "$SERIAL" shell svc power stayon true || true
          timeout 8s adb -s "$SERIAL" logcat -c || true

          adb -s "$SERIAL" logcat -v threadtime \
            > emulator-diagnostics/android-logcat-live.txt 2>&1 &
          LOGCAT_PID="$!"

          sleep 2

          echo "Emulator details:"
          adb devices -l
          adb -s "$SERIAL" shell getprop ro.build.version.release
          adb -s "$SERIAL" shell getprop ro.product.model

          echo "Starting Sa7bi AI UI smoke test..."
          run_integration_test

          stop_logcat_capture
          echo "Android UI smoke test completed successfully."
          BASH

          chmod +x "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"
          bash -n "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

          echo "Emulator script syntax validation passed."

      - name: Run UI checks and collect emulator diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          script: bash "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

      - name: Upload Android UI smoke and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-android-ui-smoke-diagnostics
          path: |
            android-ui-smoke.log
            emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14
