
name: Sa7bi AI - Android UI Smoke Test

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ui-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-android-ui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-smoke:
    name: Run app screens on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      EXPECTED_BRANCH: "fix/build-692-network-client-lifecycle"
      FLUTTER_VERSION: "3.38.1"

    steps:
      - name: Checkout the intended branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'fix/build-692-network-client-lifecycle' }}
          fetch-depth: 1

      - name: Verify repository and branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          fi
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Expected branch: ${EXPECTED_BRANCH}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Pre-build Android debug APK before emulator startup
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo "Debug APK pre-build completed."

      - name: Enable KVM permissions for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "ERROR: /dev/kvm is not available."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "KVM access is ready."
          ls -l /dev/kvm

      - name: Prepare Android UI smoke script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh" <<'BASH'
          #!/usr/bin/env bash

          set -Eeuo pipefail

          SERIAL="${ANDROID_SERIAL:-emulator-5554}"

          mkdir -p emulator-diagnostics
          : > android-ui-smoke.log

          collect_failure() {
            local status="$1"
            trap - ERR

            echo "Collecting emulator diagnostics. Exit code: ${status}"

            adb devices -l \
              > emulator-diagnostics/adb-devices.txt 2>&1 || true

            adb -s "$SERIAL" logcat -d -v threadtime \
              > emulator-diagnostics/android-logcat.txt 2>&1 || true

            ps aux \
              > emulator-diagnostics/processes.txt 2>&1 || true

            grep -E '[e]mulator|[q]emu|[a]db' \
              emulator-diagnostics/processes.txt \
              > emulator-diagnostics/emulator-processes.txt || true

            if [[ -d /tmp/android-runner ]]; then
              find /tmp/android-runner -maxdepth 3 -type f \
                \( -name '*crash*' -o -name '*.log' \) \
                -exec cp -f {} emulator-diagnostics/ \; \
                2>/dev/null || true
            fi

            echo "$status" \
              > emulator-diagnostics/exit-code.txt

            exit "$status"
          }

          trap 'collect_failure "$?"' ERR

          echo "Waiting for Android emulator..."
          adb wait-for-device

          echo "Checking Android boot completion..."

          boot_status=""

          for attempt in {1..60}; do
            boot_status="$(
              adb -s "$SERIAL" shell getprop sys.boot_completed \
                2>/dev/null | tr -d '\r' || true
            )"

            if [[ "$boot_status" == "1" ]]; then
              break
            fi

            sleep 2
          done

          if [[ "$boot_status" != "1" ]]; then
            echo "ERROR: Android emulator did not finish booting."
            false
          fi

          echo "Android emulator boot completed."

          echo "Disabling emulator network for offline UI test..."
          adb -s "$SERIAL" shell svc wifi disable
          adb -s "$SERIAL" shell svc data disable

          adb devices -l

          echo "Starting Sa7bi AI integration UI test..."

          flutter test \
            integration_test/sa7bi_app_smoke_test.dart \
            --no-pub \
            -d "$SERIAL" \
            --reporter expanded \
            2>&1 | tee android-ui-smoke.log

          echo "Android UI smoke test completed successfully."
          BASH

          chmod +x "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

          bash -n "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

          echo "Emulator script syntax validation passed."

      - name: Run UI checks and collect emulator diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/sa7bi-android-ui-smoke.sh"

      - name: Upload Android UI smoke and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-android-ui-smoke-diagnostics
          path: |
            android-ui-smoke.log
            emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14
