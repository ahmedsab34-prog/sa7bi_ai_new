name: Sa7bi AI - Legacy Feature Worker Deployment Disabled

run-name: Legacy Feature Worker Deployment Disabled - ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deployment-disabled:
    name: Block independent feature Worker deployment
    runs-on: ubuntu-latest

    steps:
      - name: Explain the unified release policy
        shell: bash
        run: |
          {
            echo "## Independent Worker deployment is disabled"
            echo
            echo "No Cloudflare Worker was deployed."
            echo
            echo "Worker-only deployment can create a mismatch"
            echo "between the installed APK and the live backend."
            echo
            echo "Use the unified release workflow:"
            echo ".github/workflows/verify-release-branch.yml"
            echo
            echo "That workflow builds the APK and deploys both Workers"
            echo "from one exact source commit."
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::notice::No Worker deployment was performed."
