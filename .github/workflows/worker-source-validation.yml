name: Sa7bi AI - Worker Source Validation

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "backend/**"
      - "lib/services/ads_service.dart"
      - "lib/config/credits_config.dart"
      - "android/app/src/main/AndroidManifest.xml"
      - ".github/workflows/worker-source-validation.yml"
  pull_request:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - "backend/**"
      - "lib/services/ads_service.dart"
      - "lib/config/credits_config.dart"
      - "android/app/src/main/AndroidManifest.xml"
      - ".github/workflows/worker-source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-worker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-worker:
    name: Validate Worker syntax, tests, AdMob and bundles without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "${ACTUAL_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::Checked-out source does not match the triggering commit."
            exit 1
          fi

          echo "Validated source commit: ${ACTUAL_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Check JavaScript syntax and social smoke tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Verify AdMob identifiers and reward policy
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          node verify-admob-config.mjs

      - name: Bundle primary Worker without deploying
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.toml

      - name: Bundle fallback Worker without deploying
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler-fallback.toml

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sa7bi Worker source validation"
            echo
            echo "- Source branch: ${GITHUB_REF_NAME}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- JavaScript syntax and social smoke tests: executed"
            echo "- AdMob configuration consistency: executed"
            echo "- Primary Worker dry-run: executed"
            echo "- Fallback Worker dry-run: executed"
            echo "- Worker deployment: NO"
            echo "- Cloudflare settings changed: NO"
          } >> "${GITHUB_STEP_SUMMARY}"
