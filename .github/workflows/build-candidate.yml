
name: Sa7bi AI - Legacy Candidate Build Retired

run-name: Candidate Build Retired - ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-candidate-disabled:
    name: Explain the single-release-pipeline policy
    runs-on: ubuntu-latest
    steps:
      - name: Record that independent candidate APK builds are retired
        shell: bash
        run: |
          {
            echo "## Independent candidate APK builds are retired"
            echo
            echo "This workflow no longer builds or publishes an APK."
            echo
            echo "All official APK builds now belong to:"
            echo ".github/workflows/verify-release-branch.yml"
            echo
            echo "That unified workflow builds the APK once from the triggering commit,"
            echo "deploys Primary and Fallback Workers from that same commit,"
            echo "verifies both live Worker source identities,"
            echo "and publishes that same APK to the stable GitHub Release."
            echo
            echo "To build the official release, push changes to:"
            echo "fix/build-692-network-client-lifecycle"
            echo
            echo "No Worker deployment or APK publication was performed by this retired workflow."
            echo "Source commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::notice::This retired workflow did not build an APK or deploy Workers."
