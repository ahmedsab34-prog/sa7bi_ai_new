name: Sa7bi AI - Candidate Checks Only

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - ".github/workflows/build-candidate.yml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-candidate-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"

jobs:
  checks-only:
    name: Analyze and test source (no APK build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source commit
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Expected commit: ${GITHUB_SHA}"
          echo "Checked out commit: ${ACTUAL_SHA}"

          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run network lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          test -f test/sa7bi_network_client_lifecycle_test.dart
          flutter test --no-pub --reporter expanded \
            test/sa7bi_network_client_lifecycle_test.dart

      - name: Run image intent tests when available
        shell: bash
        run: |
          set -euo pipefail

          if [ -f test/image_intent_detector_test.dart ]; then
            flutter test --no-pub --reporter expanded \
              test/image_intent_detector_test.dart
          else
            echo "Image intent test file not present; skipped."
          fi

      - name: Confirm this workflow does not build or publish APKs
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "SA7BI AI - SOURCE CHECKS REPORT"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Flutter version: ${FLUTTER_VERSION}"
            echo "Purpose: source analysis and tests only"
            echo "APK build: no"
            echo "Worker deployment: no"
            echo "GitHub Release publication: no"
            echo "Canonical APK workflow: verify-release-branch.yml"
          } | tee source-checks-report.txt

      - name: Upload source checks report
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-source-checks-${{ github.run_number }}-${{ github.sha }}
          path: source-checks-report.txt
          if-no-files-found: error
          retention-days: 14
