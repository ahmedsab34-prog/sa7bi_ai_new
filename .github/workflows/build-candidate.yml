
name: Sa7bi AI - Candidate Build Only

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa7bi-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.1"
  JAVA_VERSION: "17"
  APP_VERSION: "1.0.1"
  APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"

jobs:
  candidate-build:
    name: Analyze, test, build and upload candidate APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Print build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "App version: ${APP_VERSION}"

      - name: Clean Flutter outputs
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        shell: bash
        run: |
          set -uo pipefail

          set +e
          flutter analyze 2>&1 | tee flutter-analyze-report.txt
          ANALYZE_STATUS=${PIPESTATUS[0]}
          set -e

          ERROR_COUNT=$(grep -c "error •" flutter-analyze-report.txt || true)

          echo "Flutter analyze exit code: ${ANALYZE_STATUS}"
          echo "Detected analyzer errors: ${ERROR_COUNT}"

          if [ "${ERROR_COUNT}" -gt 0 ]; then
            echo "Blocking Dart analyzer errors were found."
            exit 1
          fi

          if [ "${ANALYZE_STATUS}" -ne 0 ]; then
            echo "Analyzer returned a non-zero exit code."
            echo "Review the uploaded analyzer report."
            exit 1
          fi

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-candidate-analyzer-${{ github.run_number }}
          path: flutter-analyze-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build candidate release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --build-name="${APP_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define="SA7BI_APP_VERSION=${APP_VERSION}" \
            --dart-define="SA7BI_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" \
            --dart-define="SA7BI_COMMIT_SHA=${GITHUB_SHA}" \
            --dart-define="APP_BUILD_ID=run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --dart-define="APP_SOURCE_ID=${GITHUB_REPOSITORY}@${GITHUB_SHA}"

      - name: Verify candidate APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: Candidate APK was not created."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${APK_PATH}")
          APK_SHA256=$(sha256sum "${APK_PATH}" | awk '{print $1}')

          if [ "${APK_SIZE}" -le 1000000 ]; then
            echo "ERROR: APK size is unexpectedly small."
            exit 1
          fi

          unzip -l "${APK_PATH}" | grep -q "libapp.so"

          echo "APK path: ${APK_PATH}"
          echo "APK size: ${APK_SIZE} bytes"
          echo "APK SHA256: ${APK_SHA256}"
          echo "Source commit: ${GITHUB_SHA}"

      - name: Upload candidate APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-candidate-apk-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Candidate build summary
        if: always()
        shell: bash
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "This workflow does not deploy Workers."
          echo "This workflow does not publish or replace a release APK."
