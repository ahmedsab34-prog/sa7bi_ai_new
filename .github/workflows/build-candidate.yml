name: Sa7bi AI - Candidate Build and Verification

on:
push:
branches:
- fix/build-692-network-client-lifecycle
workflow_dispatch:

permissions:
contents: read

concurrency:
group: sa7bi-candidate-${{ github.ref }}
cancel-in-progress: true

env:
FLUTTER_VERSION: "3.38.1"
JAVA_VERSION: "17"
APP_VERSION: "1.0.1"
APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"

jobs:
candidate-build:
name: Analyze, test, build and verify candidate APK
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout exact branch commit
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Verify checked-out source commit
    shell: bash
    run: |
      set -euo pipefail

      ACTUAL_SHA="$(git rev-parse HEAD)"

      echo "Expected commit: ${GITHUB_SHA}"
      echo "Checked out commit: ${ACTUAL_SHA}"
      echo "Branch: ${GITHUB_REF_NAME}"

      if [ "${ACTUAL_SHA}" != "${GITHUB_SHA}" ]; then
        echo "::error::Checked-out source does not match the workflow commit."
        exit 1
      fi

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: ${{ env.JAVA_VERSION }}

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: ${{ env.FLUTTER_VERSION }}
      channel: stable
      cache: true

  - name: Record build identity
    shell: bash
    run: |
      set -euo pipefail

      {
        echo "Branch: ${GITHUB_REF_NAME}"
        echo "Commit: ${GITHUB_SHA}"
        echo "Run ID: ${GITHUB_RUN_ID}"
        echo "Run number: ${GITHUB_RUN_NUMBER}"
        echo "Attempt: ${GITHUB_RUN_ATTEMPT}"
        echo "App version: ${APP_VERSION}"
        echo "Flutter version: ${FLUTTER_VERSION}"
        echo "Java version: ${JAVA_VERSION}"
      } | tee candidate-build-identity.txt

  - name: Clean Flutter outputs
    run: flutter clean

  - name: Get dependencies
    run: flutter pub get

  - name: Analyze Dart code
    shell: bash
    run: |
      set -uo pipefail

      set +e
      flutter analyze 2>&1 | tee flutter-analyze-report.txt
      ANALYZE_STATUS=${PIPESTATUS[0]}
      set -e

      echo "${ANALYZE_STATUS}" > flutter-analyze-status.txt

      ERROR_COUNT="$(grep -c " error • " flutter-analyze-report.txt || true)"

      echo "Analyzer exit code: ${ANALYZE_STATUS}"
      echo "Detected Dart errors: ${ERROR_COUNT}"

      if [ "${ERROR_COUNT}" -gt 0 ]; then
        echo "::error::Dart analyzer errors were found."
        exit 1
      fi

      if [ "${ANALYZE_STATUS}" -ne 0 ]; then
        if grep -Eq '[0-9]+ issues found\.' flutter-analyze-report.txt; then
          echo "::warning::Analyzer reported non-error issues. Review the full report."
        else
          echo "::error::Flutter analyzer failed unexpectedly."
          exit 1
        fi
      fi

  - name: Upload analyzer report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: sa7bi-candidate-analyzer-${{ github.run_number }}
      path: |
        flutter-analyze-report.txt
        flutter-analyze-status.txt
      if-no-files-found: warn
      retention-days: 14

  - name: Run Flutter tests
    shell: bash
    run: |
      set -uo pipefail

      set +e
      flutter test --reporter expanded 2>&1 | tee flutter-test-report.txt
      TEST_STATUS=${PIPESTATUS[0]}
      set -e

      echo "${TEST_STATUS}" > flutter-test-status.txt

      if [ "${TEST_STATUS}" -ne 0 ]; then
        echo "::error::Flutter tests failed."
        exit 1
      fi

  - name: Build candidate release APK
    shell: bash
    run: |
      set -euo pipefail

      flutter build apk \
        --release \
        --build-name="${APP_VERSION}" \
        --build-number="${GITHUB_RUN_NUMBER}" \
        --dart-define="SA7BI_APP_VERSION=${APP_VERSION}" \
        --dart-define="SA7BI_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" \
        --dart-define="SA7BI_COMMIT_SHA=${GITHUB_SHA}" \
        --dart-define="APP_BUILD_ID=run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
        --dart-define="APP_SOURCE_ID=${GITHUB_REPOSITORY}@${GITHUB_SHA}"

  - name: Verify APK and create verification report
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f "${APK_PATH}" ]; then
        echo "::error::Candidate APK was not created."
        exit 1
      fi

      APK_SIZE="$(stat -c%s "${APK_PATH}")"
      APK_SHA256="$(sha256sum "${APK_PATH}" | awk '{print $1}')"

      if [ "${APK_SIZE}" -le 1000000 ]; then
        echo "::error::APK size is unexpectedly small."
        exit 1
      fi

      if ! unzip -l "${APK_PATH}" | grep -q "libapp.so"; then
        echo "::error::APK does not contain the expected Flutter app library."
        exit 1
      fi

      ANALYZE_STATUS="$(cat flutter-analyze-status.txt)"
      TEST_STATUS="$(cat flutter-test-status.txt)"

      {
        echo "SA7BI AI - CANDIDATE VERIFICATION REPORT"
        echo "Branch: ${GITHUB_REF_NAME}"
        echo "Commit: ${GITHUB_SHA}"
        echo "Repository: ${GITHUB_REPOSITORY}"
        echo "Run ID: ${GITHUB_RUN_ID}"
        echo "Run number: ${GITHUB_RUN_NUMBER}"
        echo "Attempt: ${GITHUB_RUN_ATTEMPT}"
        echo "App version: ${APP_VERSION}"
        echo "Build number: ${GITHUB_RUN_NUMBER}"
        echo "Analyzer exit code: ${ANALYZE_STATUS}"
        echo "Test exit code: ${TEST_STATUS}"
        echo "APK path: ${APK_PATH}"
        echo "APK size bytes: ${APK_SIZE}"
        echo "APK SHA256: ${APK_SHA256}"
        echo "APK contains libapp.so: yes"
        echo "Worker deployment performed: no"
        echo "Play Store release performed: no"
        echo "Runtime feature verification: not proven by build alone"
      } | tee candidate-verification.txt

  - name: Upload verified candidate package and reports
    uses: actions/upload-artifact@v4
    with:
      name: sa7bi-candidate-apk-${{ github.run_number }}
      path: |
        ${{ env.APK_PATH }}
        candidate-build-identity.txt
        candidate-verification.txt
        flutter-analyze-report.txt
        flutter-test-report.txt
      if-no-files-found: error
      retention-days: 14

  - name: Candidate build summary
    if: always()
    shell: bash
    run: |
      echo "Branch: ${GITHUB_REF_NAME}"
      echo "Commit: ${GITHUB_SHA}"
      echo "Run ID: ${GITHUB_RUN_ID}"
      echo "This workflow does not deploy Workers."
      echo "This workflow does not publish or replace a release APK."
