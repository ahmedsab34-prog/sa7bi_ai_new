# Read-only Worker diagnostics with exact source identity checks.

name: Sa7bi AI - Comprehensive Worker Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/build-692-network-client-lifecycle"
    paths:
      - ".github/workflows/worker-network-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: sa7bi-worker-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose Worker connectivity, routes and source identity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PRIMARY: https://sa7bi-ai-new.ahmedsab34.workers.dev
      FALLBACK: https://sa7bi-ai-new-fallback.ahmedsab34.workers.dev
      EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
      REPEAT_COUNT: "3"

    steps:
      - name: Verify branch and collect environment evidence
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "ahmedsab34-prog/sa7bi_ai_new"
          test "${GITHUB_REF_NAME}" = "fix/build-692-network-client-lifecycle"

          mkdir -p diagnostic-report

          {
            echo "SA7BI AI - READ-ONLY WORKER DIAGNOSTIC"
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Expected source commit: ${EXPECTED_SOURCE_COMMIT}"
            echo "Runner: $(uname -a)"
            echo
            echo "=== DNS ==="

            for host in \
              sa7bi-ai-new.ahmedsab34.workers.dev \
              sa7bi-ai-new-fallback.ahmedsab34.workers.dev
            do
              echo "--- ${host}"
              getent ahosts "${host}" 2>&1 | sort -u || true
            done

            echo
            echo "=== Tool versions ==="
            curl --version | head -n 2
            openssl version
            jq --version
          } | tee diagnostic-report/environment.txt

      - name: Probe Primary, Fallback and API routes
        shell: bash
        run: |
          set +e

          REPORT="diagnostic-report/results.tsv"
          DETAILS="diagnostic-report/details.txt"

          printf 'host\tpath\tattempt\tcurl_exit\thttp_status\tdns_s\ttcp_s\ttls_s\ttotal_s\tremote_ip\tsource_commit\tbackend_version\tfallback_route\tfallback_source_commit\tapi_ok\terror\n' > "${REPORT}"

          : > "${DETAILS}"

          header_value() {
            local header_name="$1"
            local header_file="$2"

            grep -i "^${header_name}:" "${header_file}" \
              | tail -n 1 \
              | cut -d ':' -f 2- \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          json_value() {
            local expression="$1"
            local body_file="$2"

            jq -r "${expression} // empty" "${body_file}" 2>/dev/null \
              | head -c 160
          }

          probe() {
            local host_label="$1"
            local base_url="$2"
            local path="$3"
            local attempt="$4"
            local url="${base_url}${path}"

            local headers body error metrics
            local rc status dns tcp tls total ip
            local source_commit backend_version
            local fallback_route fallback_source_commit api_ok
            local error_text

            headers="$(mktemp)"
            body="$(mktemp)"
            error="$(mktemp)"

            metrics=$(curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-redirs 5 \
              --location \
              --dump-header "${headers}" \
              --output "${body}" \
              --write-out $'%{http_code}\t%{time_namelookup}\t%{time_connect}\t%{time_appconnect}\t%{time_total}\t%{remote_ip}' \
              "${url}" 2>"${error}")

            rc=$?

            IFS=$'\t' read -r status dns tcp tls total ip <<< "${metrics}"

            status="${status:-000}"
            dns="${dns:-NA}"
            tcp="${tcp:-NA}"
            tls="${tls:-NA}"
            total="${total:-NA}"
            ip="${ip:-NA}"

            source_commit="$(json_value '.sourceCommit' "${body}")"
            backend_version="$(json_value '.backendVersion' "${body}")"

            fallback_route="$(header_value \
              "X-Sa7bi-Network-Fallback" "${headers}")"

            fallback_source_commit="$(header_value \
              "X-Sa7bi-Fallback-Source-Commit" "${headers}")"

            if jq -e 'type == "object" and .ok == true' "${body}" \
              >/dev/null 2>&1; then
              api_ok="true"
            elif jq -e 'type == "object" and .ok == false' "${body}" \
              >/dev/null 2>&1; then
              api_ok="false"
            else
              api_ok="n/a"
            fi

            error_text="$(tr '\t\r\n' '   ' < "${error}" | cut -c1-250)"
            [ -n "${error_text}" ] || error_text="none"

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${host_label}" \
              "${path}" \
              "${attempt}" \
              "${rc}" \
              "${status}" \
              "${dns}" \
              "${tcp}" \
              "${tls}" \
              "${total}" \
              "${ip}" \
              "${source_commit}" \
              "${backend_version}" \
              "${fallback_route}" \
              "${fallback_source_commit}" \
              "${api_ok}" \
              "${error_text}" \
              >> "${REPORT}"

            {
              echo
              echo "=================================================="
              echo "HOST=${host_label}"
              echo "PATH=${path}"
              echo "ATTEMPT=${attempt}"
              echo "URL=${url}"
              echo "curl_exit=${rc}"
              echo "HTTP=${status}"
              echo "DNS=${dns}s TCP=${tcp}s TLS=${tls}s TOTAL=${total}s"
              echo "REMOTE_IP=${ip}"
              echo "SOURCE_COMMIT=${source_commit}"
              echo "BACKEND_VERSION=${backend_version}"
              echo "FALLBACK_ROUTE=${fallback_route}"
              echo "FALLBACK_SOURCE_COMMIT=${fallback_source_commit}"
              echo "API_OK=${api_ok}"
              echo "ERROR=${error_text}"
              echo "--- Response headers"
              tail -n 25 "${headers}"
              echo "--- Response body (first 1200 bytes)"
              head -c 1200 "${body}"
              echo
            } >> "${DETAILS}"

            echo "${host_label} ${path} attempt ${attempt} -> HTTP ${status}, curl exit ${rc}"

            rm -f "${headers}" "${body}" "${error}"
          }

          # Core checks on both Worker hostnames.
          for spec in \
            "primary|${PRIMARY}" \
            "fallback|${FALLBACK}"
          do
            label="${spec%%|*}"
            base="${spec#*|}"

            for path in \
              /health \
              / \
              /v1/service-status \
              /v1/diagnostics
            do
              for ((attempt=1; attempt<=REPEAT_COUNT; attempt++)); do
                probe "${label}" "${base}" "${path}" "${attempt}"
                sleep 1
              done
            done
          done

          # Primary API route checks.
          # Tafsir requires a valid positive tafsir ID.
          for path in \
            /v1/news \
            /v1/audio/quran \
            '/v1/tafsir?tafsir=1&sura=1' \
            /v1/tafsir/books \
            '/v1/tafsir/audio?tafsir=1&sura=1' \
            /v1/hadith \
            /v1/hadith/books \
            /v1/radio/health \
            /v1/radio/countries \
            '/v1/radio/stations?country=EG' \
            '/v1/audio/search-v4?q=diagnostic' \
            '/v1/podcasts/search?q=diagnostic' \
            /v1/shorts
          do
            for ((attempt=1; attempt<=REPEAT_COUNT; attempt++)); do
              probe "primary" "${PRIMARY}" "${path}" "${attempt}"
              sleep 1
            done
          done

          {
            echo
            echo "=== TLS HANDSHAKE CHECKS ==="

            for host in \
              sa7bi-ai-new.ahmedsab34.workers.dev \
              sa7bi-ai-new-fallback.ahmedsab34.workers.dev
            do
              echo "--- ${host}"

              timeout 15 openssl s_client \
                -connect "${host}:443" \
                -servername "${host}" \
                -brief </dev/null 2>&1 | head -n 30

              echo "TLS pipeline exit: ${PIPESTATUS[0]}"
            done
          } >> "${DETAILS}" 2>&1

      - name: Generate route and source identity diagnosis
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' > diagnostic-report/diagnosis.txt
          import csv
          import os
          from collections import defaultdict

          filename = "diagnostic-report/results.tsv"
          expected = os.environ.get(
              "EXPECTED_SOURCE_COMMIT", ""
          ).strip().lower()

          try:
              with open(filename, newline="") as f:
                  rows = list(csv.DictReader(f, delimiter="\t"))
          except FileNotFoundError:
              rows = []

          print("SA7BI AI - WORKER DIAGNOSIS")
          print("==========================")
          print("Expected source commit:", expected or "not available")

          if not rows:
              print()
              print("RESULT: No probe results were recorded.")
              print("ACTION: Inspect earlier workflow steps.")
              raise SystemExit(0)

          groups = defaultdict(list)

          for row in rows:
              groups[(row["host"], row["path"])].append(row)

          def first(host, path):
              return next(
                  (
                      row for row in rows
                      if row["host"] == host
                      and row["path"] == path
                  ),
                  None,
              )

          def compare(label, actual):
              actual = (actual or "").strip()
              actual_lower = actual.lower()

              if not expected:
                  print(f"{label}: NOT VERIFIED - expected commit missing")
              elif not actual or actual_lower == "unknown":
                  print(f"{label}: NOT VERIFIED - source identity missing")
              elif actual_lower == expected:
                  print(f"{label}: MATCH")
              else:
                  print(f"{label}: MISMATCH")
                  print("  Expected:", expected)
                  print("  Actual:  ", actual)

          print()
          print("=== PRIMARY / FALLBACK CONNECTIVITY ===")

          for host in ("primary", "fallback"):
              core = [
                  row
                  for (h, path), values in groups.items()
                  if h == host and path in ("/health", "/")
                  for row in values
              ]

              http = [
                  row for row in core
                  if row["http_status"] not in ("000", "")
              ]

              ok = [
                  row for row in core
                  if row["http_status"] == "200"
              ]

              failures = [
                  row for row in core
                  if row["http_status"] == "000"
              ]

              print()
              print("HOST:", host)
              print(
                  f"Core attempts: {len(core)}; "
                  f"HTTP responses: {len(http)}; "
                  f"HTTP 200: {len(ok)}; "
                  f"No HTTP response: {len(failures)}"
              )

              if not core:
                  print("RESULT: Core probes missing.")
              elif not http:
                  print("RESULT: Connection-level failure.")
              elif not ok:
                  statuses = sorted({
                      row["http_status"] for row in http
                  })
                  print("RESULT: HTTP response but no HTTP 200.")
                  print("Statuses:", ", ".join(statuses))
              elif failures:
                  print("RESULT: Reachable, but intermittent failures occurred.")
              else:
                  print("RESULT: Core connectivity passed.")

          print()
          print("=== EXACT SOURCE IDENTITY ===")

          primary_health = first("primary", "/health")
          fallback_health = first("fallback", "/health")

          primary_commit = (
              primary_health["source_commit"]
              if primary_health else ""
          )

          forwarded_primary_commit = (
              fallback_health["source_commit"]
              if fallback_health else ""
          )

          fallback_commit = (
              fallback_health["fallback_source_commit"]
              if fallback_health else ""
          )

          fallback_route = (
              fallback_health["fallback_route"]
              if fallback_health else ""
          )

          compare("Primary Worker source commit", primary_commit)
          compare(
              "Fallback Worker source commit",
              fallback_commit,
          )
          compare(
              "Primary commit forwarded through Fallback",
              forwarded_primary_commit,
          )

          if fallback_route == "1":
              print("Fallback routing header: CONFIRMED")
          else:
              print(
                  "Fallback routing header: NOT CONFIRMED "
                  f"(actual={fallback_route or 'missing'})"
              )

          print()
          print("=== TAFSIR ROUTE VALIDATION ===")

          tafsir_path = "/v1/tafsir?tafsir=1&sura=1"
          tafsir_rows = groups.get(
              ("primary", tafsir_path),
              [],
          )

          if not tafsir_rows:
              print("TAFSIR: NOT TESTED")
          else:
              statuses = [
                  row["http_status"] for row in tafsir_rows
              ]
              api_flags = [
                  row["api_ok"] for row in tafsir_rows
              ]

              passed = (
                  all(status == "200" for status in statuses)
                  and all(flag == "true" for flag in api_flags)
              )

              if passed:
                  print(
                      "TAFSIR: PASS - valid query returned HTTP 200 "
                      "and ok=true on every attempt"
                  )
              else:
                  print("TAFSIR: NEEDS REVIEW")
                  print("HTTP statuses:", ", ".join(statuses))
                  print("API ok flags:", ", ".join(api_flags))

          print()
          print("=== ROUTE SUMMARY ===")

          for (host, path), values in sorted(groups.items()):
              statuses = [
                  row["http_status"] for row in values
              ]

              api_flags = sorted({
                  row["api_ok"] for row in values
              })

              count_200 = statuses.count("200")
              count_no_response = statuses.count("000")

              if count_200 == len(values):
                  state = "HTTP 200 on every attempt"
              elif count_200:
                  state = "MIXED / INTERMITTENT"
              elif count_no_response == len(values):
                  state = "CONNECTION FAILURE"
              else:
                  state = "HTTP RESPONSE BUT NOT 200"

              print(
                  f"{host} {path}: {state}; "
                  f"statuses={','.join(statuses)}; "
                  f"api_ok={','.join(api_flags)}"
              )

          print()
          print("=== IMPORTANT INTERPRETATION ===")
          print("- This workflow is read-only.")
          print("- It does not deploy either Worker.")
          print("- It does not change Cloudflare secrets or settings.")
          print("- It does not send chat/image POST requests.")
          print("- It does not reserve or deduct AI credits.")
          print("- The expected commit is the commit that triggered this run.")
          print("- Source identity MATCH means the live Worker reports that exact commit.")
          print("- HTTP 200 alone does not prove business logic is correct.")
          print("- GitHub runner success does not prove Android phone connectivity.")
          print("- A green workflow means evidence collection completed; inspect the identity and route verdicts above.")
          PY

          cat diagnostic-report/diagnosis.txt

      - name: Add findings to GitHub Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sa7bi AI Worker diagnostic findings"
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Expected source commit: ${EXPECTED_SOURCE_COMMIT}"
            echo
            cat diagnostic-report/diagnosis.txt 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa7bi-worker-diagnostic-${{ github.run_id }}
          path: diagnostic-report/
          if-no-files-found: warn
          retention-days: 14
