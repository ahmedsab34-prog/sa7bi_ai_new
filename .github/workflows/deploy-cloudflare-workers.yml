name: Sa7bi AI - Legacy Worker Deployment Disabled

run-name: Legacy Worker Deployment Disabled - ${{ github.sha }}

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - ".github/DEPLOY_CLOUDFLARE_WORKERS"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deployment-disabled:
    name: Block separate Worker-only deployment
    runs-on: ubuntu-latest

    steps:
      - name: Explain the unified release policy
        shell: bash
        run: |
          {
            echo "## Legacy Worker-only deployment is disabled"
            echo
            echo "No Cloudflare Worker was deployed."
            echo
            echo "The old independent deployment path is retired."
            echo
            echo "Use the unified workflow instead:"
            echo ".github/workflows/verify-release-branch.yml"
            echo
            echo "The unified workflow builds and verifies the APK,"
            echo "deploys both Workers from the same commit,"
            echo "checks their live source identities,"
            echo "and only then updates the stable APK release."
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::notice::No Worker deployment was performed."
