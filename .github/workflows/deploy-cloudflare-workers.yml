
name: Sa7bi AI - Deploy Cloudflare Workers

run-name: Deploy Sa7bi Workers from ${{ github.sha }}

on:
  push:
    branches:
      - fix/build-692-network-client-lifecycle
    paths:
      - ".github/DEPLOY_CLOUDFLARE_WORKERS"

permissions:
  contents: read

concurrency:
  group: sa7bi-cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy primary, then fallback
    if: github.repository == 'ahmedsab34-prog/sa7bi_ai_new' && github.ref == 'refs/heads/fix/build-692-network-client-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify repository, branch, commit, trigger, and credentials
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_REPOSITORY="ahmedsab34-prog/sa7bi_ai_new"
          EXPECTED_BRANCH="fix/build-692-network-client-lifecycle"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "::error::Unexpected repository."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]]; then
            echo "::error::Deployment is restricted to ${EXPECTED_BRANCH}."
            exit 1
          fi

          if [[ "${ACTUAL_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checked-out source does not match the triggering commit."
            exit 1
          fi

          if [[ ! -f ".github/DEPLOY_CLOUDFLARE_WORKERS" ]]; then
            echo "::error::The explicit deployment trigger file is missing."
            exit 1
          fi

          TRIGGER_VALUE="$(sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' .github/DEPLOY_CLOUDFLARE_WORKERS | paste -sd ' ' -)"
          if [[ "${TRIGGER_VALUE}" != "DEPLOY PRIMARY AND FALLBACK" ]]; then
            echo "::error::The deployment trigger confirmation text is invalid."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub secret."
            exit 1
          fi

          echo "Repository verified: ${GITHUB_REPOSITORY}"
          echo "Branch verified: ${GITHUB_REF_NAME}"
          echo "Exact source commit verified: ${ACTUAL_SHA}"
          echo "Cloudflare credential presence verified; values are not displayed."

      - name: Verify both Wrangler targets and the service binding
        shell: bash
        run: |
          set -euo pipefail

          grep -Fx 'name = "sa7bi-ai-new"' backend/wrangler.toml
          grep -Fx 'main = "src/index-v2.js"' backend/wrangler.toml

          grep -Fx 'name = "sa7bi-ai-new-fallback"' backend/wrangler-fallback.toml
          grep -Fx 'main = "src/fallback.js"' backend/wrangler-fallback.toml
          grep -Fx 'service = "sa7bi-ai-new"' backend/wrangler-fallback.toml

          echo "Only the two approved existing Worker names are configured."
          echo "Fallback service binding targets the primary Worker."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund
          npx wrangler --version

      - name: Run backend smoke tests and AdMob consistency checks
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node verify-admob-config.mjs

      - name: Dry-run primary Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.toml

      - name: Dry-run fallback Worker
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler-fallback.toml

      - name: Deploy primary Worker first
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml

      - name: Deploy fallback Worker after primary
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler-fallback.toml

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sa7bi AI Cloudflare Worker deployment"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Exact source commit: ${GITHUB_SHA}"
            echo "- Primary target: sa7bi-ai-new"
            echo "- Fallback target: sa7bi-ai-new-fallback"
            echo "- Deployment order: primary first, fallback second"
            echo "- Backend smoke tests and both dry-runs: inspect the steps above"
            echo "- No API token, account ID, or secret values are printed."
          } >> "${GITHUB_STEP_SUMMARY}"
