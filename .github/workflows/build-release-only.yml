
name: Sa7bi AI - Canonical Release Path Notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Explain the official APK release path
    runs-on: ubuntu-latest

    steps:
      - name: Show the canonical release instructions
        shell: bash
        run: |
          {
            echo "## Official Sa7bi AI APK release path"
            echo
            echo "This workflow intentionally does not build or publish an APK."
            echo
            echo "The canonical APK is built by:"
            echo "\`.github/workflows/verify-release-branch.yml\`"
            echo
            echo "Expected stable download URL:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/sa7bi-ai.apk"
            echo
            echo "Wait for the canonical release workflow to complete successfully."
            echo "Then verify its APK checksum and source commit before distribution."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "No APK was built. Use the canonical release workflow."
