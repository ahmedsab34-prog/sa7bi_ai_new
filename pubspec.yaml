name: sa7bi_ai
description: Sa7bi AI - Your smart Arabic AI companion.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio
  audio_service: ^0.18.19
  just_audio: ^0.9.39
  audio_session: ^0.1.21

  # Network
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.2

  # Images / camera
  image_picker: ^1.1.2

  # Open external links
  url_launcher: ^6.3.1

  # Sharing
  share_plus: ^10.0.2

  # Permissions
  permission_handler: ^11.3.1

  # UI / utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
