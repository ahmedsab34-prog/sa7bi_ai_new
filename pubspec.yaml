name: sa7bi_ai_new
description: "A high-end Android Flutter application featuring Sa7bi AI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.4
  google_mobile_ads: ^8.0.0
  permission_handler: ^11.3.0
  http: ^1.2.0
  image_picker: ^1.0.8

  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - app_icon.png
