publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  audio_service: ^0.18.19
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  flutter_tts: ^4.2.3

  http: ^1.2.2
  webview_flutter: ^4.13.0
  shared_preferences: ^2.3.2

  image_picker: ^1.1.2
  file_picker: ^8.1.7
  speech_to_text: ^7.3.0

  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  permission_handler: ^11.3.1

  google_mobile_ads: ^6.0.0

  intl: ^0.19.0

  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
