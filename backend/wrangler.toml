
name = "sa7bi-ai-new"
main = "src/index-v2.js"
compatibility_date = "2026-09-18"

workers_dev = true

[vars]
GEMINI_TEXT_MODEL = "gemini-3.8-flash"
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"

WORKERS_TEXT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
WORKERS_VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
WORKERS_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"

ADMOB_REWARDED_AD_UNIT_ID = "ca-app-pub-9077658292229374/4621745555"
ADMOB_REWARD_ITEM = "credits"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "SA7BI_CREDITS"
class_name = "Sa7biCredits"

[[durable_objects.bindings]]
name = "SA7BI_SOCIAL"
class_name = "Sa7biSocial"

[exports.Sa7biCredits]
type = "durable-object"
storage = "sqlite"

[exports.Sa7biSocial]
type = "durable-object"
storage = "sqlite"

[[r2_buckets]]
binding = "SA7BI_REELS"
bucket_name = "sa7bi-ai-reels"

[secrets]
required = ["GEMINI_API_KEY"]
